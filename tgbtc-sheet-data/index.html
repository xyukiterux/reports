<template id="files"><h3>Download the data</h3><p>The <a href="TG_Org_Sheet_Starter.xlsx" download><b>Excel data book</b></a> has every page you see here in one file. The <a href="TG_Org_Sheet_Data_Pack.zip" download>zip</a> adds the raw tables below for whoever builds the org's own sheet. A single CSV file is plain data with no colours: open it with Excel, or just use the Excel data book.</p>
<details><summary>Raw tables (CSV), one by one</summary><div class="tw" style="max-height:none;margin-top:8px"><table class="plain"><thead><tr><th>File</th><th>What is in it</th><th class="r">Rows</th><th>Source</th></tr></thead><tbody><tr><td><a href="csv/01_characters.csv">01_characters.csv</a></td><td>One row per character: org, attribute, rarity, role, two tier lists, release date, how to get it.</td><td class="r">145</td><td class="dim">gluttony.dev game database SEA 13368 (built 2026-11-12); tiers: Org guide (xyukiterux.github.io/guides) and gluttony.dev tier list</td></tr><tr><td><a href="csv/02_stats_lv1_and_max.csv">02_stats_lv1_and_max.csv</a></td><td>Level-1 stats and maximum stats / combat power (CP) for every character. Blank max = not ranked by the source.</td><td class="r">145</td><td class="dim">gluttony.dev game database SEA 13368 (built 2026-11-12) (max values are the site&#x27;s own calculation at the top level cap)</td></tr><tr><td><a href="csv/03_growth_per_level.csv">03_growth_per_level.csv</a></td><td>How much Attack, Defense and Health ONE level adds. Characters are sorted into growth groups (Rank_20 to Rank_60: a bigger number grows faster; table 02 says which group a character is in). The stage is how many rank-ups the character has had (0 = none yet).</td><td class="r">35</td><td class="dim">gluttony.dev game database SEA 13368 (built 2026-11-12) cell calculator; client table HeroRank</td></tr><tr><td><a href="csv/03b_level_caps.csv">03b_level_caps.csv</a></td><td>The ladder of level caps. A character stops at each cap (30, 40, 45 ... up to 500) until you raise its limit; 500 is the last cap in the game files, and servers open the higher caps over time, so nobody is there yet. Rank-up levels (55, 80, 110, 145, 300) are where a character ranks up and starts growing faster.</td><td class="r">145</td><td class="dim">gluttony.dev game database SEA 13368 (built 2026-11-12); client table HeroQuality</td></tr><tr><td><a href="csv/04_build_constants.csv">04_build_constants.csv</a></td><td>The fixed numbers behind builds: what a Potential or a Bond level adds, and how RC Cell modification rolls work (how many rolls, the possible values, the cap per line). For calculators, not for reading.</td><td class="r">60</td><td class="dim">gluttony.dev game database SEA 13368 (built 2026-11-12) (cell calculator)</td></tr><tr><td><a href="csv/05_star_steps.csv">05_star_steps.csv</a></td><td>What each star unlocks, whether any passive also works from the back-up slot, and the max-rank skill change.</td><td class="r">145</td><td class="dim">Game client tables (tkgbtc.com hero-data copy, 2026-10-28); gluttony.dev game database SEA 13368 (built 2026-11-12)</td></tr><tr><td><a href="csv/06_skills_and_passives.csv">06_skills_and_passives.csv</a></td><td>Full game text of every active card (with damage multipliers), passive, rank passive and Ability Sphere.</td><td class="r">1,284</td><td class="dim">Game client tables (tkgbtc.com hero-data copy, 2026-10-28) (FightingSkill + en.json); gluttony.dev game database SEA 13368 (built 2026-11-12)</td></tr><tr><td><a href="csv/07_breakthrough_talents.csv">07_breakthrough_talents.csv</a></td><td>Breakthrough talents: at each of 3 tiers a character picks 1 of 5 options. This lists every option for every character.</td><td class="r">1,860</td><td class="dim">gluttony.dev game database SEA 13368 (built 2026-11-12)</td></tr><tr><td><a href="csv/08_cp_by_release.csv">08_cp_by_release.csv</a></td><td>Every SSR/UR with its release date and max CP: the raw rows behind the org power trend. Launch-roster units have no date in the data and are grouped as Launch.</td><td class="r">123</td><td class="dim">gluttony.dev game database SEA 13368 (built 2026-11-12)</td></tr><tr><td><a href="csv/09_cp_by_org_per_quarter.csv">09_cp_by_org_per_quarter.csv</a></td><td>Org power over time: average max CP of each quarter&#x27;s new SSR/UR units, the running average, and the best-5 average (a &quot;best team&quot; proxy). Last rows are a simple projection.</td><td class="r">48</td><td class="dim">Computed from 08_cp_by_release</td></tr><tr><td><a href="csv/10_pull_banners.csv">10_pull_banners.csv</a></td><td>Every summon banner in the client table: price per pull, rate groups, guarantee milestones, featured units. Rate groups are listed top group first: on Regular Recruit they are SSR / SR / R (3% / 30% / 67%); on other banners the first group is the featured or top group. Exact per-character rates are in 10b. 300 Diamonds per pull on regular, limited and Legacy banners; 600 on Carnival banners.</td><td class="r">140</td><td class="dim">Broken Chains data site (btc-web-863ee.web.app), read 2026-11-04: Gacha table</td></tr><tr><td><a href="csv/10b_pull_rates_per_unit.csv">10b_pull_rates_per_unit.csv</a></td><td>Per-character pull rate on every banner (rate 0.00143 = 0.143%).</td><td class="r">5,085</td><td class="dim">Broken Chains data site (btc-web-863ee.web.app), read 2026-11-04: Gacha table reward_show</td></tr><tr><td><a href="csv/11_paid_packs_usd.csv">11_paid_packs_usd.csv</a></td><td>Paid sign-ins and packs that carry a USD price in the event table. Dates are the original (older-server) run.</td><td class="r">56</td><td class="dim">Broken Chains data site (btc-web-863ee.web.app), read 2026-11-04: Activity calendar table</td></tr><tr><td><a href="csv/12_diamond_economy.csv">12_diamond_economy.csv</a></td><td>Diamond income by source, paid cards, VIP daily gifts, buy/skip verdicts, pull costs and Stronghold pay. Includes a NOT KNOWN YET list.</td><td class="r">45</td><td class="dim">Org guide (xyukiterux.github.io/guides) economy data (as of 2026-11-04)</td></tr><tr><td><a href="csv/13_creator_meta_teams.csv">13_creator_meta_teams.csv</a></td><td>Team screens from creator videos, Dec 2025 to Oct 2026, one row per team, with the video link at the exact second.</td><td class="r">33</td><td class="dim">Creator YouTube videos, read card by card against the game portraits</td></tr><tr><td><a href="csv/14_game_modes.csv">14_game_modes.csv</a></td><td>Every game mode with a short how-it-works.</td><td class="r">20</td><td class="dim">Org guide (xyukiterux.github.io/guides)</td></tr><tr><td><a href="csv/15_boss_and_war_rules.csv">15_boss_and_war_rules.csv</a></td><td>Game rule text for World Boss, Org Boss, Weekly Challenge, Conquest and the Stronghold wars. Archived text: a live boss can override it, so read the boss info screen.</td><td class="r">69</td><td class="dim">Game client tables (tkgbtc.com hero-data copy, 2026-10-28) (en.json rule text), audited 2026-11-02</td></tr><tr><td><a href="csv/15b_boss_example_teams.csv">15b_boss_example_teams.csv</a></td><td>Example teams per boss from the older guide. Untested on the current patch: use as a starting point.</td><td class="r">100</td><td class="dim">Org guide (xyukiterux.github.io/guides)</td></tr><tr><td><a href="csv/16_server_day_calendar.csv">16_server_day_calendar.csv</a></td><td>What opens on which server day and what to do about it (banners, shops, level caps, rebate windows).</td><td class="r">57</td><td class="dim">Org guide (xyukiterux.github.io/guides)</td></tr><tr><td><a href="csv/17_rules_and_glossary.csv">17_rules_and_glossary.csv</a></td><td>Short rule summaries per system plus the game glossary (effects, keywords).</td><td class="r">165</td><td class="dim">Org guide (xyukiterux.github.io/guides); Game client tables (tkgbtc.com hero-data copy, 2026-10-28) (en.json)</td></tr><tr><td><a href="csv/18_banner_history.csv">18_banner_history.csv</a></td><td>Banner schedule from the event table: by server day for new servers, by date for the original run.</td><td class="r">71</td><td class="dim">Game client tables (tkgbtc.com hero-data copy, 2026-10-28) (activity table)</td></tr><tr><td><a href="csv/19_patch_log.csv">19_patch_log.csv</a></td><td>Recent game-data versions and which characters changed: the trigger to refresh the sheet.</td><td class="r">6</td><td class="dim">gluttony.dev game database SEA 13368 (built 2026-11-12)</td></tr><tr><td><a href="csv/20_rc_cells_raw.csv">20_rc_cells_raw.csv</a></td><td>Raw RC Cell (gear) table from the game files: every cell with its rarity, type and main-stat roll.</td><td class="r">210</td><td class="dim">Game client tables (tkgbtc.com hero-data copy, 2026-10-28)</td></tr><tr><td><a href="csv/21_rank_up_costs_raw.csv">21_rank_up_costs_raw.csv</a></td><td>Raw rank-up table from the game files: what each rank-up step costs and the growth per level after it.</td><td class="r">35</td><td class="dim">Game client tables (tkgbtc.com hero-data copy, 2026-10-28)</td></tr><tr><td><a href="csv/22_game_constants_raw.csv">22_game_constants_raw.csv</a></td><td>Raw list of game constants from the game files (limits, costs, timers, battle numbers). Names are the developers&#x27; own; for people building calculators.</td><td class="r">1,563</td><td class="dim">Game client tables (tkgbtc.com hero-data copy, 2026-10-28)</td></tr></tbody></table></div></details>

w.youtube.com/" target="_blank" rel="noopener">https://www.youtube.com/</a></td><td>Team screens and tips: Shi, Aslan, Kitcat, Sandro, Guff, Black_Assasine12, ZoltanVidakF2P and others. Every row in tab 13 links the exact video and second.</td><td class="dim">Tab 13.</td></tr><tr><td class="b">In-game screens</td><td>in the game</td><td>The only source for: VIP EXP per level, Diamond top-up prices, shop prices and limits, current boss rules.</td><td class="dim">Fill the NOT KNOWN YET rows in tab 12.</td></tr></tbody></table></div></template>

,"group":null,"cols":[{"h":"Server day","hint":"","img":null,"w":14,"kind":"","bold":true,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null},{"h":"What happens","hint":"","img":null,"w":67.4,"kind":"","bold":true,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null},{"h":"Details","hint":"","img":null,"w":132.4,"kind":"","bold":false,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null},{"h":"How sure are we","hint":"","img":null,"w":36.1,"kind":"","bold":false,"dim":true,"center":false,"pct":false,"x":false,"islink":false,"label":null}],"rows":[["1 to 14","New-server package: do every quest","server days 1-14: New-server package: Novice sign-in, Quest Pass, novice Legacy Custom. Do every quest. Skip the novice Legacy selector unless you have 60,000 to reach its pick at pull 200 (a separate calendar Legacy banner with meta units is live until ~Oct 29 — see its card).","Our guide"],["1 to 7","Novice Rebate Phase 1 (days 1-7)","server days 1-7: Novice Rebate Phase 1 (top-up ladder). Buy day-1 passes inside it [game data]. Spend real money only inside a rebate window.","Our guide (from game data)"],["1 to 7","Wish Rebate (days 1-7): Nutcracker","server days 1-7: Wish Rebate (Nutcracker, tiers as low as $9.99). Closed as day 8 began. No Nutcracker rerun is scheduled in the data; a creator calls her non-exclusive [video: Aslan 09-15], so a return is possible [inferred: creator remark; no rerun in the data].","Our guide"],["3","Day 3: build one working team","server day 3: Build one working team. Read each unit's innate passive and faction buff before you spend anything. Mark the units and stars you own; then copy a team from Best teams.","Our guide"],["7","Day 7: beginner events end","server day 7: Check beginner events before they end. The Wish Rebate (Nutcracker) ran on server days 1–7 on the NA relaunch server. Check your own timer. Nutcracker may not come back after the offer closes.","Our guide"],["8 to 14","Days 8-14: skip the Juzo [CCG Maverick] banner","server days 8-14: Juzo [CCG Maverick] banner: SKIP. He enters a shop on day 15 [game data].","Our guide (from game data)"],["8 to 14","Novice Rebate Phase 2 (days 8-14)","server days 8-14: Novice Rebate Phase 2 (top-up ladder). 133 Event Summon Tickets across 12 tiers [game data]. Spend real money only inside a rebate window.","Our guide (from game data)"],["14","Day 14: log in (SSR Selection Card)","server days 14-14: Celebration Sign-In day 14: SSR Selection Card. Don't miss this login [game data].","Our guide (from game data)"],["14","Day 14: use your selectors","server day 14: Use your selectors. Novice recruitment closed after server day 14 on the NA relaunch server. Unlimited Recruitment may follow your account age; check its timer.","Our guide"],["15","Day 15: shop (Juzo [CCG Maverick], Hinami [Fledgling Butterfly])","server days 15-15: Shop: Juzo [CCG Maverick], Hinami [Fledgling Butterfly]. Shop entries are real; which shop and price aren't in the data [check in game: shop currency].","Our guide"],["15 to 21","Days 15-21: Novice Rebate Phase 3","server days 15-21: Novice Rebate Phase 3 (top-up ladder). 133 Event Summon Tickets + 1,200 Limit Crystals + 1,200 Crimson Crystals [game data].","Our guide (from game data)"],["15 to 28","Days 15-28: skip the Uta [Mask-Maker] banner","server days 15-28: Uta [Mask-Maker] banner: SKIP. Shop on day 29 [game data].","Our guide (from game data)"],["19","Day 19: Carnival 1 opens","server days 19-19: Carnival 1 opens (most likely \"Set Sail\", Arima [CCG's Reaper]). Brings Carnival Recruitment, Carnival Arena, Region Breakthrough and Stronghold Takeover [inferred: Carnival Support Project runs days 19–25; global Carnival 1 began day 19]. Its Selection Chest is most likely the Season 1 list (Kaneki [Christmas], Hinami [Christmas] or a Lv.6 Potential) [game data], not the 31-unit list with Hideyoshi. Carnival Arena needs Arena Gold 5 by Mon Oct 26 05:00 (day 15) at the latest — the game takes your tier from before 05:00 each Monday.","Our guide (from game data)"],["19 to 25","Days 19-25: Carnival Support Project (needs Chain Level 50)","server days 19-25: Carnival Support Project (top-up ladder). 187 Carnival Summon Tickets + 265 Exclusive Treasure Box keys; needs Chain Level 50 [game data].","Our guide (from game data)"],["20","Day 20: first possible Stronghold Takeover","server days 20-20: First possible guild war (Stronghold Takeover), Sat. Only the top 8 orgs in that week's Weekly Challenge enter. Prep 10:00, battle 12:00–15:00 server time [game data] [inferred: first Saturday after Carnival opens].","Our guide (from game data)"],["21","Day 21: random SSR card sign-in","server days 21-21: Celebration Sign-In day 21: random SSR card. [game data]","Our guide (from game data)"],["26 to 32","Days 26-32: Novice Rebate Phase 4","server days 26-32: Novice Rebate Phase 4 (top-up ladder). 133 tickets; top tier = Random Rainbow Potential [game data].","Our guide (from game data)"],["26 to 42","Days 26-42: skip the Ayato [Rebelwing] limited banner","server days 26-42: Ayato [Rebelwing] limited banner: SKIP. Launch-era Aogiri, 300 pity [game data].","Our guide (from game data)"],["28","Day 28: check your investment; second Selection Card","server day 28: Check your team investment. The second SSR Selection Card came on day 28 in the old guide: take Shu [Gourmet]. Check your rewards. Unlock useful passives before you spread stars around.","Our guide"],["30","Day 30: hero level cap 200","server days 30-30: Hero level cap 200. [game data]","Our guide (from game data)"],["33","Day 33: Strategic Arena matchmaking","server days 33-33: Strategic Arena matchmaking starts (it unlocks from day 15 at Chain Depth 120; level, limit and gear are made equal, star rating and refinement carry over). [game data]","Our guide (from game data)"],["34 to 55","Days 34-55: Diamond Rebate Project","server days 34-55: Diamond Rebate Project: THE best spend window. 151,500 Diamonds over 19 tiers, 1,000 at tier 1 [game data]. Put passes and the Monthly Contract here. Tier thresholds [check in game: not in data].","Our guide (from game data)"],["34","If you spend at all: only inside a rebate window","You don't have to spend. If you do, buy inside a rebate window. A rebate window makes each purchase pay twice. The best one is the Diamond Rebate, server days 34–55. Plain Diamonds are the worst value: 80 per $1 (October 19 price).","Our guide"],["40","Day 40: Abyssal Battlefield (Chain Level 130)","server days 40-40: Abyssal Battlefield eligible (Chain Level 130); first weekly run Mon of day 43. [game data]","Our guide (from game data)"],["43","Day 43: shop wave","server days 43-43: Shop wave: Uta [Rescue] (No Org buffer), Kiyoko Aura (guild war), Shu [Mr.MM] and 16 more. Listed for a shop in the data [game data]; which shop and price [check in game: unconfirmed]. If it's sold, buy Uta [Rescue] first.","Our guide (from game data)"],["58","Day 58: bank checkpoint 60,000","server days 58-58: Bank checkpoint: 60,000 (one 200-pity banner). With one-time progress income: VIP 5 ≈ day 30–40, VIP 0 ≈ day 50. Recurring income alone: VIP 5 ≈ day 50, VIP 0 ≈ day 75.","Our guide"],["60","Day 60: level cap 235","server days 60-60: Hero level cap 235 · Strategic Arena Tactics. [game data]","Our guide (from game data)"],["62 to 76","Days 62-76: Christmas banner (expected)","server days 62-76: Christmas banner (expected) — No Org target for VIP 5 / spenders. 2025: Rize [Christmas] (No Org; at 0★ raises allies' skill levels after No Org skills), 300 pity, Dec 13–27 [game data] [inferred: 2025 pattern, server_start 8]. VIP 0 banks 90,000 only around day 85, after it ends.","Our guide (from game data)"],["75","Day 75: shop wave (Hideyoshi, Nishiki [Orochi], Black Rabbit...)","server days 75-75: Shop wave: Hideyoshi [Best Friend], Nishiki [Orochi], Ayato [Black Rabbit], Juzo [False Girl], Owl of Readiness…. Listed for a shop in the data [game data]; which shop and price [check in game: unconfirmed]. If sold, this completes the F2P No Org team: Hideyoshi first. Also Carnival 3 [inferred: 35-day cycle].","Our guide (from game data)"],["75","F2P: VIP 0 is fine","Free players: VIP 0 works. Creators run free accounts at VIP 0 through server day 75. (creator report) Don't top up just for VIP. The daily VIP mail never pays Diamonds.","Our guide (guide site data)"],["76 to 97","Days 76-97: New Year banners; Uta [New Year] is the default F2P target","server days 76-97: New Year banners (expected): Toka [New Year], then Uta [New Year] — the default F2P target. Uta [New Year] (2025: Jan 10–17, ≈ day 91–98) is a No Org back-up booster at 0★, 300 pity [game data] [inferred: 2025 pattern]. VIP 0 reaches 90,000 around day 85, in time.","Our guide (from game data)"],["77","Day 77: level cap 250","server days 77-77: Hero level cap 250. [game data]","Our guide (from game data)"],["90","Day 90: review your teams","server day 90: Review your teams. Recheck boss teams, daily limits and event rules. Compare your logged fights before you replace your main team.","Our guide"],["119","Day 119: level cap 280","server days 119-119: Hero level cap 280. [game data]","Our guide (from game data)"],["Any time","Bank towards one limited banner","Totals: VIP 0: about 940 a day (893 from the game data plus 50 from daily quests) while the 30-day Free Monthly Pass lasts, then about 840 a day (about 5,900 a week). From a new account at VIP 0, with the pass ending on day 30: about 103 days to bank 90,000 Diamonds for a limited banner, about 68 days for a 60,000 rate-up. Events, codes, mail and Saturday guild war payouts make it faster.","Our guide (guide site data)"],["Any time","Best per-$ buy","The Endless Trials Pass #1 gave the most per $1 on October 19. Plain Diamonds gave the least.","Our guide"],["Any time","Claim the day-1 sign-in unit (Enji)","Sign-in units by server day: Enji (day 1), Yakumo [Jason] (day 5), Kureo (day 9), Kurona (day 13).","Our guide"],["Any time","Daily income to collect","name: Free Monthly Pass (new servers); amount: 100 a day; note: New servers get it for 30 days. Whether it comes back after that is unconfirmed.; source: Game data (FreeLoginMonth: 100 Diamonds); creator video Aslan, October 25, 2026 name: Daily quests (activity chest); amount: 50 a day; note: Not counted in the October 19 totals. (creator report); source: Creator video Aslan, October 25, 2026 name: Weekend sign-in; amount: 2 Event Summon Tickets a week (about 86 Diamonds a day in pulls); note: One ticket is one 300-Diamond pull.; source: Game data (WeekendSignReward_3: Event Summon Ticket x2) VIP 0: about 940 a day (893 from the game data plus 50 from daily quests) while the 30-day Free Mo…","Our guide (guide site data)"],["Any time","Do not pull yet","Save Diamonds and tickets for one banner you can finish. Pity doesn't carry over, so never start a banner you can't finish.","Our guide + >=3 CREATORS"],["Any time","F2P: read tiers at 0★ for banner units, full stars for shop units","So the Starter and Mid teams use units you can really own and upgrade. An S unit you can't get, or can't star up, doesn't help your team. Free player? Read banner units at \"At 0★\" and shop units at \"At full stars\".","Our guide (guide site data)"],["Any time","Faction order after the first team","No Org first: the cheapest. Nutcracker came from the days 1–7 Wish Rebate (now closed), and the free No Org units all power her up. Aogiri second, once your first team is complete: your second guild-war team, and the only team for Formidable Noro. CCG third: three bosses take 30% more from CCG, and Kureo is free. Anteiku last: creators call it \"struggling\" after the October 14 patch, and its free units are not a real team.","Our guide"],["Any time","Free units of week 1","Sign-in units by server day: Enji (day 1), Yakumo [Jason] (day 5), Kureo (day 9), Kurona (day 13). Sen: Unlimited Recruitment, in your first 14 days after you register. Rize [Binge Eater]: free mission chain.","Our guide"],["Any time","Global Pinnacle: 5 teams on forced auto","Plan: Build 5 teams: fights are 5 against 5, best of 5, on forced auto.","Our guide"],["Any time","Join an active organization","Join an active organization on day 1. Only the top 8 organizations in that week's Weekly Challenge can enter guild war.","Our guide + 2 CREATORS"],["Any time","Learn the battle basics","Bring attributes that beat the boss: STR beats SKL, SKL beats SPD, SPD beats STR. Merge skill cards to Lv3 before you cast. Stun and full Weak stop counters; Disruption does not.","Our guide"],["Any time","Level only the main team","Level only your main team (5–6 units, back-up included). A second copy (1★) is the best upgrade: it unlocks the second passive. Put Limit Crystals into your main carry.","Our guide + >=3 CREATORS"],["Any time","Pick one faction and build its strongest team first","Pick one faction and build its strongest team first. No Org is the cheapest start.","Our guide + 1 CREATOR"],["Any time","Play Chain Campaign; save Diamonds","Play Chain Campaign. Save Diamonds until you know which banner you will finish.","Our guide"],["Any time","Shop priorities: Uta [Rescue], then Hideyoshi","If the shop sells them, buy Uta [Rescue] (day 43) first, then Hideyoshi (day 75). Check the shop tabs every week.","Our guide"],["Any time","Sign-in units and selection cards","Sign-in units by server day: Enji (day 1), Yakumo [Jason] (day 5), Kureo (day 9), Kurona (day 13). Day-14 SSR Selection Card: take Naki [Crybaby]. Day-28 card: Shu [Gourmet].","Our guide"],["Any time","Start the Diamond Spring exchange","name: Diamond Spring exchange; amount: About +520 a day per exchange; note: Stake 500. The 24-hour option returns 1,020 on average, the 48-hour option 1,315. If a running 48-hour exchange blocks your daily slot, collecting every 24 hours pays more; creators say to always pick 48 hours, so check in game. Creators report 1,200 to 2,500 back on the 48-hour option, and one says it was cut to 1,200–1,500 (creator report). You get 1 exchange a day at VIP 0; one creator says the second needs VIP 5, another says VIP 7, so check your VIP screen.; source: October 19 article \"Pull and spend\" (game data); creator videos Aslan (May 14 and October 25, 2026), Shi (April 27, 2026), Zeketta (April 23, 2026)…","Our guide (guide site data)"],["Any time","Team shape: 4 + 1 back-up","Start from a line-up on Best teams. Use 4 on the field plus 1 back-up. The back-up only uses passives marked \"[Effective also in back-up state]\". One character can't be in two teams.","Our guide"],["Any time","Use the half-cost Stamina","Tip: Half-cost Stamina on new servers (days 1-28) covers Biography.","Our guide"],["Any time","Whales: where VIP stops paying","One creator reached VIP 6 with the monthly login contract plus growth funds, and says to stop at VIP 5: it adds sweeps and, by his account, the second Diamond Spring exchange (about +520 a day). Another creator puts that exchange at VIP 7, so check the VIP screen before you top up for it. (creator report) Big spenders: creators name no perk worth chasing between VIP 9 and 13; VIP 19 and up adds avatar borders and much bigger daily Limit Crystal mail. (creator report)","Our guide (guide site data)"],["Any time","Why Chain Campaign first","unlock: From the start why: Its Depth unlocks other modes (Assignments, World Boss at Depth 15, Unlimited Recruitment milestones) and raises idle-farm income. After Auto-Battle unlocks, spend Chain Licenses (1 per battle; they reset to 10 daily at 05:00).","Our guide (guide site data)"],["Any time","Why No Org for free players","Pick one faction and stay with it. Free-to-play: No Organization is the cheapest. Nutcracker came from the days 1–7 Wish Rebate (now closed), Sen is free, and the free No Org units all power her up.","Our guide"],["Any time","Why you end up needing 3 teams","3. After Encounter begins, each player needs to use 3 lineups to fight the enemy 3 times 4. Once a lineup is used in a battle, the Characters in the lineup cannot be deployed in other lineups in the same round of Encounter. The Carnival Arena is a special arena that requires 3 teams to play a best-of-3 format.","GAME DATA"]]},{"id":"game-modes","tab":"Game modes","title":"Game modes","what":"Every game mode with what kind of mode it is and how it works, step by step.","how":"Look up a mode by name before you spend attempts on it.","group":null,"cols":[{"h":"Mode","hint":"","img":null,"w":40.5,"kind":"","bold":true,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null},{"h":"Kind","hint":"","img":null,"w":42.9,"kind":"","bold":false,"dim":true,"center":false,"pct":false,"x":false,"islink":false,"label":null},{"h":"How it works","hint":"","img":null,"w":166.7,"kind":"","bold":false,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null}],"rows":[["Chain Campaign","Main progression + idle farm","Clear Normal, Elite and Boss levels on each Depth map, then claim the level rewards to open the next Depth.\nKill the Elite directly to chain-clear every Normal level after it; kill the Boss directly to chain-clear the whole Depth.\nKill all enemies within the turn limit to trigger a Chain and clear related levels at once; tap the map chest to claim them.\nAfter Auto-Battle unlocks, spend Chain Licenses (1 per battle; they reset to 10 daily at 05:00).\nTap the Idle Farming chest before it hits its cap.\nOpen Fragment Chests as they finish; higher Depth gives better chests (UR chests start above Depth 60).\nMulti-team stages: don't spread your strong units across all teams. Each team = 1–2 carries that solo the stage, 2–3 buffers that may die early, and a back-up whose passive says \"Effective also in back-up state\" (battle-start buffs persist; \"while on the field\" auras die with the unit)."],["Exploration (story maps)","Story","Walk the map, fight enemies and open Treasure Caskets for points.\nWatch HP: characters in an Exploration team don't recover lost HP after battles.\nFinish the main goal quests to finalize the map and get its rewards.\nAt 20% Exploration Progress, use Sweep Coupons to collect all Map Rewards instantly."],["Conquest Battle (bosses) and Formidable","Boss dungeon (co-op)","Read the boss's characteristics, then set a team that answers them.\nStrike the boss's weak points during the fight for extra rewards.\nInvite other players to fight together if you can't solo it.\nOnly spend attempts you can win: Conquest Coupons are deducted only on victory, and a failed start costs just 1 Stamina.\nFor Formidable bosses (no Stamina cost), clear them in order; server-wide clear counts unlock bonus rewards."],["Force Challenge (Biography)","3-stage dungeon","Pick your team first: it's locked for the whole run.\nFight 3 stages in a row; HP carries over between them.\nExpect enemies to gain random passive skills.\nClear as many stages as you can: more stages mean better Finalization Rewards.\nDon't fear failing: a loss costs only 1 Stamina."],["Blockade Breakthrough","Daily dungeon","Pick the day's buff effects; they can't be changed after you confirm.\nClear stages in order; every owned character can take part.\nRotate units: lost HP is not restored, and no healing goes above a unit's pre-fight HP.\nRespawns (revive one unit to 100%) only come with a Monthly Login Contract.\nCome back daily: it resets every day. Spend tokens in the Blockade Breakthrough Shop.\nUse your VIP manual reset attempts (VIP levels unlock them) to replay stages for a second round of rewards."],["Assignments (Bounty and Urgent)","Dispatch + co-op boss","Dispatch eligible characters to Bounty Assignments and wait out the timer.\nFight the battle-type Bounty and Boss Assignments directly.\nMeet the bonus goals for extra rewards; they don't block completion.\nAfter 5-7 Bounty Assignments, an Urgent Assignment (co-op boss) may trigger; the first successful run pays Conquest Rewards.\nAsk friends or strangers to help on Urgent Assignments after your first try.\nAround the 9th-16th Bounty, an Assignment Sale can appear : buy only the Gold-priced items and skip the Diamond-priced ones."],["Abyssal Battlefield (weekly rogue-like)","Weekly run","Choose 1 character to bring in. Units below full stars are treated as full stars, so bring your best kit, not your highest star.\nMove 1 grid at a time; you can't go back after a grid's event.\nAfter each normal-map win, pick 1 buff (re-roll with simulation coins).\nBeat each normal map's final boss to advance; after 3 normal maps, 3 hard maps open (no buffs there).\nDon't quit mid-battle: losing or exiting fails the run.\nCollect Abyss Coins from moves, battles, bosses and chests."],["Region Breakthrough (Carnival)","Carnival stage mode","Stages unlock in order. The higher the stage, the harder it is and the better the rewards.\nSave a line-up to enter: those characters are locked in, and lost HP carries over from fight to fight until the stage is cleared or the whole team is dead.\nOn the map, tap enemy groups to add them to one fight. Each group adds CP; enemies after the 4th wait in back-up and step in.\nDefeat every boss and reach 100% Extermination to clear the stage.\nIf your whole team dies, the run fails. Give Up resets the area.\nYour first clear is rated by how many battles you entered, and a better rating pays a better first-clear reward.\nEvery enemy gets Fixed Modifiers (they swap each week) and Regional Modifiers (by stage number).\nWeekly reset: Monday 05:00 (server time). Clear at least 1 stage that week for the weekly reward. Next week you can start up to stage 9 if you cleared more than 7, stage 7 for 6–7, stage 4 for 3–5, stage 2 for 0–2.\nWhen the Carnival ends, your highest stage pays the Carnival reward and sets where you start next Carnival."],["Tower Trials","Climb","Pick the right trial: STR/SKL/SPD trials only take that type (PSY, WIT and DST go anywhere); faction trials only take that faction.\nClear main stages in order; some unlock EX stages.\nCheck each stage's special rules before fighting.\nOn hard Elite stages, open other players' clear teams in the stage details and copy them."],["Stronghold Annihilation","Organization war (top 3 only)","Saturday after Takeover: preparation 15:30, battle 16:00–17:00 (server time).\nSet your line-ups and study the map during preparation.\nEach battle uses 1 team. Each stronghold has a required CP: a team below it can't attack.\nDefeat defenders for Annihilation Points. When a stronghold's defenders are all beaten, it pays out by each Organization's rank there.\nLost HP is not restored right away. Fallen characters come back after a wait (1,200 s in the game settings), or revive at once with Diamonds or Quick Recovery Potions."],["World Boss","Damage race","Attack daily: you get 3 attempts a day, and every challenge pays a reward.\nAim for damage milestones; single-battle and accumulated damage both pay.\nRemember the boss can't be killed; it leaves after a while and the top 100 get ranking rewards."],["Twin Campaign","2-player co-op","Team up with a partner; each of you deploys one squad.\nWin both battles to clear a floor (if your progress matches, either player can run both).\nWait for the floor's chests to unlock in sequence.\nClear a floor fully (boss + all chests) for a permanent stat buff."],["Encounter","3-player team ranking","Form a 3-player team (locked until Monday 05:00).\nFight 3 times with 3 different lineups; a unit used in one lineup can't join another that round.\nWin for chests and points; your lineups can be attacked by other teams and lose you points."],["Strong Enemy Assault","Character-locked stages","Check each stage's required characters and level them first.\nPick the stage order you like.\nMeet the 3 star conditions in one attempt; your best single attempt counts.\nFail freely: a loss costs only 1 energy."],["Stronghold Takeover (Guild War)","Organization war, Saturdays","Saturday: preparation from 10:00, battle 12:00–15:00, rank rewards at 15:00 (server time).\nEach player sets 3 teams. You start from your Base, which can't be attacked, and can only attack tiles next to ones you hold.\nYou start with 10 attack charges and get 1 more every 20 minutes. You can buy 19 more for 2,790 Diamonds in total; the first 3 cost 50 each.\nEvery stronghold you hold earns points every 5 minutes. Strongholds still yours at the end pay a final share.\nTaking another Organization's stronghold steals 50% of the points stored there.\nLost HP stays lost between fights and comes back slowly outside battle. Fallen characters recover slowly, or you revive them with Diamonds or Quick Recovery Potions (each revive costs more).\nHealing can't raise a unit above the HP it had when the fight started."],["Carnival","Event season: every Carnival mode","Carnival Recruitment: the featured unit drops at 1% per pull, and every 100 pulls opens a chest whose contents change by season. Season 1 (Set Sail, likely this server's Carnival 1): 30% the featured unit, 30% a Selection Chest that offers only Kaneki [Christmas], Hinami [Christmas] or a Lv.6 Potential, 24% a Panacean Star-Up Crystal, 16% a Refinement Crystal. Season 2's chest has no Selection Chest (24% featured). Read the chest odds on each Carnival's banner, and pull only in blocks of 100.\nCarnival Arena: 3 teams, best of 3, 10 tries a day (its own guide below).\nRegion Breakthrough: stage-by-stage fights with a locked team (its own guide below).\nCarnival Exchange: spend Carnival Tokens. Tokens are not cleared when a Carnival ends.\nParagon Teams: Carnival Tokens raise a team's Paragon Level, a level boost in Carnival modes (its own guide below).\nStronghold Takeover and Stronghold Annihilation: the Saturday Organization wars (their own guides below).\nWeekly Carnival quests pay about 2,000 Tokens and 1,050 Diamonds."],["Carnival Arena","3-team PvP, best of 3","Save 3 line-ups; a line-up saves with at least 1 character.\nChallenge a higher-ranked player; win and you swap ranks.\n10 tries a day, refilled at 05:00. Challenges close 1 hour before the 22:00 settlement.\nDaily rewards at 22:00, weekly rewards on Sunday at 22:00 (server time).\nWin at least 1 battle to get a rank. Rankings are cleared when the Carnival ends."],["Paragon Teams","Carnival team upgrade","A Paragon Team holds several teams. Only max-level characters can join.\nCarnival Tokens raise each team's Paragon Level; its members fight as if leveled above the level cap.\nMax Paragon Level unlocks a Team Passive. Reroll it with Carnival Tokens for a better one.\nThe buff works only in Carnival modes, and all Paragon records reset when the Carnival ends."],["Arena and Attribute Arena","1v1 PvP against saved teams","You get 5 free challenges a day, refilled at 05:00 (server time). Extra challenges cost Diamonds, and each one costs more.\nBeat a higher-ranked player and you take their rank. Lose to a lower-ranked player and you drop to theirs.\nDaily rewards arrive by mail at 21:00 (server time), by rank. Reaching a rank for the first time pays a one-time reward.\nActive Rewards: five chests a day for playing Arena battles; two of them pay 50 and 100 Diamonds."],["Real-Time Arena","1v1 live PvP, cross-server","You fight live players from every server. A win gains Points, a loss loses Points.\nEvery challenge uses a try, win or lose. Tries come back 1 per hour up to the cap. You can buy up to 10 Challenge Tickets a day with Diamonds; each costs more, and the price resets daily.\nYour rank comes from your Points. Ranks reset on Monday from Sunday's final standing.\nDaily reward: by your last rank of the day, after the challenge hours end. Season reward: by your tier, after the season ends. First time at each rank: a one-time reward that a reset does not take back."]]},{"id":"rules-and-words","tab":"Rules and words","title":"Rules and words","what":"Short, plain explanations of every system in the game, followed by the game's own glossary of effects and keywords.","how":"Filter Kind to \"Word from the game\" to use it as a dictionary, or search (Ctrl+F) for the word you saw on a skill.","group":null,"cols":[{"h":"Kind","hint":"","img":null,"w":22,"kind":"","bold":false,"dim":true,"center":false,"pct":false,"x":false,"islink":false,"label":null},{"h":"Topic","hint":"","img":null,"w":49.2,"kind":"","bold":true,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null},{"h":"Explanation","hint":"","img":null,"w":145.3,"kind":"","bold":false,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null},{"h":"From","hint":"","img":null,"w":33.5,"kind":"","bold":false,"dim":true,"center":false,"pct":false,"x":false,"islink":false,"label":null}],"rows":[["How a system works","Which faction to pick (and in what order)","Pick ONE faction and build its meta team first; free players start No Org (cheapest), then Aogiri, then CCG, Anteiku last. One-faction teams are what every guide team is.","Our guide"],["How a system works","Early mistakes that waste resources (with the cost)","The expensive early mistakes are all about pulls and Diamonds: starting a banner you cannot finish, pulling shop units, pulling outside your faction, skipping timers with Diamonds, levelling everyone, and buying outside a rebate window.","Our guide"],["How a system works","The first pulls: what to save for, what to skip","Do not pull early. Save Diamonds and tickets for ONE banner you can finish in your faction: a limited unit is guaranteed at 300 pulls (90,000 Diamonds), a non-limited rate-up at 200 (60,000), and pity does not carry over. Skip any banner whose unit comes to a shop later (Juzo [CCG Maverick] day 15, Uta [Mask-Maker] day 29).","Our guide"],["How a system works","Stronghold Annihilation","Stronghold Annihilation is the org war for the top 3 organizations of the weekly Stronghold Takeover: 1 team per battle, each stronghold has a minimum CP, HP carries over.","Our guide"],["How a system works","Arena and Attribute Arena","Arena is 1v1 against saved teams on your server: 5 free challenges a day (reset 05:00), beat a higher rank to take it, daily mail at 21:00, two Active Reward chests pay 50 and 100 Diamonds. Attribute Arena (Depth 45) takes one attribute a week.","Our guide"],["How a system works","Assignments (Bounty and Urgent)","Assignments: dispatch eligible units to Bounty Assignments and wait, fight the battle ones; after 5-7 Bounties an Urgent (co-op boss) may trigger, whose first clear pays Conquest Rewards.","Our guide"],["How a system works","Attributes (STR / SKL / SPD / PSY / WIT / DST)","Attributes restrict each other: STR beats SKL, SKL beats SPD, SPD beats STR; PSY and WIT restrict each other; DST restricts everything and is restricted only by DST. Attacking a restricted enemy fills its Weak bar.","Our guide"],["How a system works","Auction House","The Auction House sells Org Boss loot: the Org Auction (members only, after the boss; members of 5+ days get a share of sales, capped at 5%) and the World Auction (unsold items, everyone). Bid from the base price or Buy at the top price.","Our guide"],["How a system works","Teams: 4 on the field + 1 back-up","A team is 4 units on the field plus 1 back-up; the back-up only uses passives marked '[Effective also in back-up state]' and enters when a field unit falls; one unit cannot be in two teams.","Our guide"],["How a system works","Force Challenge (Biography)","Force Challenge is a 3-stage run with one locked team; HP carries over; more stages cleared = better rewards; a loss costs only 1 Stamina.","Our guide"],["How a system works","Blockade Breakthrough","Blockade Breakthrough is the daily dungeon: pick the day's buffs, clear stages in order with any owned units (lost HP stays lost), spend its tokens in its shop; it resets every day.","Our guide"],["How a system works","Capture Simulation","Capture Simulation is the org PvE map: members send teams against stronghold defenders; a captured core stronghold spawns a daily Field Boss and a weekly Siege.","Our guide"],["How a system works","Skill cards, merging, energy and the Ultimate","Each turn you play skill cards from a hand; two identical adjacent cards merge into a higher level (merge to Lv3 before you cast on a boss); skills and Energy Cards fill the energy bar that fires the Ultimate.","Our guide"],["How a system works","Carnival Arena","Carnival Arena is a 3-team best-of-3 arena open during the Carnival: 10 attempts a day (reset 05:00), daily rewards at 22:00 and weekly rewards Sunday 22:00.","Our guide"],["How a system works","Carnival","The Carnival is a weeks-long bundle of modes (Carnival Recruitment, Carnival Arena, Region Breakthrough, Paragon Team) with its own tokens; it opens periodically and its tokens keep between Carnivals.","Our guide"],["How a system works","RC Cells","RC Cells are the gear: a UR cell can be Modified once (a random skill on a path farmed from that path's Conquest boss) and starred up to 5; full-score cells feed Ability Ascension; salvaging gives Gold and sometimes Diamonds.","Our guide"],["How a system works","Chain Campaign","Chain Campaign is the main progression map: clear Normal, Elite and Boss levels to raise your Depth, which unlocks other modes and raises your idle income; 10 Chain Licenses a day power auto-battle.","Our guide"],["How a system works","Coffee (recipes)","Coffee is for the illustration collection and Organization Supply; no combat bonus is known.","Our guide"],["How a system works","Conquest Battle and Formidable bosses","Conquest is the boss dungeon: read the boss, build a team that answers it, invite others if you cannot solo; failing costs 1 Stamina and coupons are only spent on a win. Formidable is the harder tier with no Stamina cost.","Our guide"],["How a system works","CP (combat power) and the CP Match","CP is the power number; the CP Match at battle start compares team CP and a higher CP gives a better chance of the initiative; CP Enhancement, Star Rating Enhancement and Attribute Enhancement are account-wide bonuses.","Our guide"],["How a system works","Diamond Spring","The Diamond Spring is a daily stake-and-return: Normal Exchange returns more the longer the duration (48h pays most), limited exchanges a day (more at higher VIP), Paid Exchange pays at once.","Our guide"],["How a system works","Diamonds: where they come from","Diamonds (300 per pull) come daily from the Diamond Spring, the Wishing Sign-in, daily quests, Arena chests, the weekend tickets and, on new servers, the free monthly pass: about 940 a day at VIP 0 while the pass lasts.","Our guide"],["How a system works","Encounter","Encounter is a 3-player team ranking: each player fights 3 times with 3 different line-ups (no unit reused that round), your line-ups can be attacked, the team is locked until Monday 05:00.","Our guide"],["How a system works","Exploration (story maps)","Exploration is the story: walk a map, fight, open caskets for points; HP is not restored between fights; 3-star goals pay Diamonds.","Our guide"],["How a system works","Factions (No Org / Aogiri Tree / Anteiku / CCG)","Four factions; every guide team is one faction and faction buffs help only that faction; No Org is the cheapest start, Aogiri the Noro team, CCG beats three bosses by 30%, Anteiku last for free players.","Our guide"],["How a system works","Global Stronghold War","Global Stronghold War is the worldwide org war: qualification by total member CP (top 512 qualify), 1-hour battles, phases with character bans that apply only there.","Our guide"],["How a system works","Exclusive Treasure Box (keys) and Ability Spheres","Keys open the Exclusive Treasure Box for a unit's Ability Sphere: 5 box qualities, a success raises the next box's quality, a failure drops it back to N; failed SSR/UR boxes build Luck.","Our guide"],["How a system works","Legacy Custom (selector banner)","Legacy Custom is a selector banner: you pick the units whose odds go up and the pick is guaranteed at 200 pulls; the novice one is a trap without 60,000 banked. Selection Cards (days 14 and 28) are free picks.","Our guide"],["How a system works","Limit (level cap) and Limit Crystals","Limit raises a unit's level cap; it costs Limit Crystals, which come from duplicate recruits; put them into your main carry.","Our guide"],["How a system works","Organization Boss","The Org Boss has a Knockback Phase (refreshes Monday and Friday: kill it fast for points) and a Bonus Phase (rewards accrue until the next refresh); buffs drop for the org to borrow.","Our guide"],["How a system works","Organization (guild)","The Organization is the guild: join an active one on day 1. It gives the Weekly Challenge, the Org Boss, the org shop and auction, Supply orders and a Tech Tree of bonuses; leaving puts you on a 24-hour cooldown (first exit excepted).","Our guide"],["How a system works","Paragon Team","Paragon Team: Carnival Tokens raise a team's Paragon Level, which acts like levels above the cap and at max unlocks a team passive; it only counts in Carnival modes and resets when the Carnival ends.","Our guide"],["How a system works","Passives, actives and the kit","Every unit has one active skill (the card) and passives that unlock by star; a buff 'for <faction> allies' helps only that faction; read the kit before you spend.","Our guide"],["How a system works","Global Pinnacle Championship / Pinnacle Showdown","Pinnacle is the cross-server tournament: 3v3 (Pinnacle Showdown) or 5-team best-of-5 on forced auto (Global Pinnacle, guide), group stages then eliminations, with a token shop.","Our guide"],["How a system works","Potentials (Gift)","Potentials are a plate of slots per unit: Exclusive Potentials empower passives; Universal Potentials of one colour in a line make a Linkage; 5 of a level synthesize one higher (max Lv.6); the Potential Wheel gives 1 free spin a day.","Our guide"],["How a system works","Recruitment (summons), rates and pity","Recruiting costs 300 Diamonds a pull (or a ticket); SSR is 3% on rate-up and standard pools, the featured units share 1%; extra rewards at 100/200/300 draws; the guide: limited = 300 pulls to guarantee, rate-up = 200, counters do not carry over.","Our guide"],["How a system works","Region Breakthrough (Carnival)","Region Breakthrough is the Carnival's dungeon: a locked line-up fights enemy groups you pick from a map, HP carries between fights, enemies carry weekly and per-stage modifiers; clear at least one stage a week (settles Monday 05:00).","Our guide"],["How a system works","Abyssal Battlefield","Abyssal Battlefield is the weekly rogue-like: bring ONE unit (treated as full stars), move one grid at a time, pick a buff after each normal-map win, collect Abyss Coins; losing or quitting fails the run.","Our guide"],["How a system works","Real-Time Arena and Strategic Arena","Real-Time Arena (Depth 75) is live 1v1 across servers for points, 1 challenge back per hour, rank reset Mondays. Strategic Arena (day 15, Depth 120) equalises level, limit, gear and bonds; only stars and refinement carry.","Our guide"],["How a system works","Shops and what to buy first","Each shop has a buy-first list: Arena shop units then the monthly duplicate and weekly UR cell; org shop the weekly recruitment / potential tickets and UR keys; Abyss shop the monthly UR tactic chest; never pay Diamonds to refresh.","Our guide"],["How a system works","Wishing Sign-in and Surprise (weekend) Sign-In","Wishing Sign-in: wish for tomorrow's reward each day (ready after 05:00), a Grand Reward every 8; Surprise Sign-In runs Saturday to Monday and pays 2 Event Summon Tickets a week.","Our guide"],["How a system works","Strong Enemy Assault","Strong Enemy Assault: stages that name the units you must use; 3 star conditions per stage, best single try counts, a loss costs 1 energy; each 3-star clear pays 1,000 Diamonds (creator tip).","Our guide"],["How a system works","Spending real money: rebate windows","You never have to spend. If you do, buy only inside a rebate window (Novice Rebate days 1-7, 8-14, 15-21, 26-32; Carnival Support days 19-25; the Diamond Rebate days 34-55 is the best); plain Diamonds are the worst value.","Our guide"],["How a system works","Stamina and Sweep Coupons","Stamina pays for story, Exploration, Conquest and Force Challenge entries (a loss costs only 1); Sweep Coupons collect a cleared map's rewards at once; half-cost Stamina runs on new servers (days 1-28).","Our guide"],["How a system works","Stars (star-up) and duplicates","Stars come from duplicates (a second copy = 1★). 0★ gives the active skill and first passive, 1★ the second passive (the biggest single upgrade), 3★ the third passive, 5★ the big stat jump, 6★ upgrades the active skill.","Our guide"],["How a system works","Stronghold Takeover (guild war)","Stronghold Takeover is the Saturday org war (prep 10:00, battle 12:00-15:00 server time) for the top 8 organizations of the Weekly Challenge: 3 teams each, take tiles next to yours, held strongholds earn points; lost HP stays lost between fights.","Our guide"],["How a system works","Tactics","Tactics are equippable items bought in shops (Abyss, Pinnacle) and crafted: consuming several makes a new type, same-quality crafts have a 10% chance of a higher quality.","Our guide"],["How a system works","The tier list (S / A / B / C / D)","S: build your team around it; A: strong in the right team; B: useful with limits; C: level only; D: skip. Units are rated at 0★ and at full stars; free players read banner units at 0★ and shop units at full stars.","Our guide"],["How a system works","Tower Trials","Tower Trials are climbs with entry rules: STR/SKL/SPD trials take only that attribute (PSY, WIT, DST go anywhere), faction trials only that faction; each stage pays once.","Our guide"],["How a system works","Twin Campaign","Twin Campaign is 2-player co-op: each partner deploys one squad, both fights must be won, chests unlock in sequence, a fully cleared floor gives a permanent stat buff.","Our guide"],["How a system works","VIP","VIP levels come only from real-money top-ups; perks are sweeps, more Diamond Spring exchanges and stamina; the daily VIP mail never pays Diamonds; free players run VIP 0, creators say stop at VIP 5.","Our guide"],["How a system works","Weak and Stun","Weak is a bar on each unit: hits from a restricting attribute fill it; a full bar Stuns the target for 1 turn (some bosses change what a full bar does).","Our guide"],["How a system works","Weekly Challenge (org)","The Weekly Challenge is the org's weekly boss fight for points (5-turn limit; difficulty raises the bonus, each borrowed unit costs 20%); its ranking decides which 8 organizations enter guild war; it finalizes Monday 0:00-5:00.","Our guide"],["How a system works","World Boss","World Boss is a damage race: 3 attempts a day, the boss cannot be killed and leaves after a while, milestones and the top 100 pay; quitting halfway does not use an attempt.","Our guide"],["Word from the game","Diamonds","The premium currency: 300 per pull; free income is about 840-940 a day at VIP 0.","Our guide"],["Word from the game","Event Summon Ticket","A free pull on the banners it works on; one ticket = one 300-Diamond pull.","Our guide"],["Word from the game","Carnival Summon Ticket","A pull on Carnival Recruitment (time-exclusive units); 100 draws there give a cumulative reward.","Game text"],["Word from the game","Pity","The pull count that guarantees the unit: 300 on a limited banner, 200 on a non-limited rate-up; it does not carry to another banner.","Game text"],["Word from the game","Limited banner","A banner whose unit never joins the regular pool afterwards; guaranteed at 300 pulls (90,000 Diamonds).","Game text"],["Word from the game","Rate-up banner","A banner where the featured units share a 1% rate on top of the 3% SSR rate; non-limited rate-ups guarantee at 200 pulls (60,000 Diamonds).","Game text"],["Word from the game","Legacy Custom","A selector banner: pick 3 units to raise their odds, change them after 200 recruits.","Game text"],["Word from the game","SSR Selection Card","A free pick of an SSR unit, given by the day-14 and day-28 sign-ins (take Naki [Crybaby], then Shu [Gourmet]).","Our guide"],["Word from the game","Character Crystal","What a duplicate recruit turns into; used to Star Up.","Game text"],["Word from the game","Panacean Star-Up Crystal","A universal star-up item (scarce); 100 shards craft one.","Game text"],["Word from the game","Stars","Copies of a unit: 1★ unlocks the second passive, 3★ the third, 5★ the big stat jump, 6★ upgrades the active skill.","Our guide"],["Word from the game","Limit Crystals","Material for raising a unit's Limit (level cap); from duplicate recruits; put them into your main carry.","Game text"],["Word from the game","Crimson Crystals","A training currency that rebate ladders pay out (1,200 in Novice Rebate Phase 3); farming it is a creator topic.","Our guide"],["Word from the game","Passive","A skill that works without being cast; unlocked by star (0★ first, 1★ second, 3★ third).","Our guide"],["Word from the game","Active skill","The unit's card you play from the hand; 6★ upgrades it (Ultra- version).","Our guide"],["Word from the game","Back-up","The fifth team slot (4 on the field plus 1 back-up): only passives marked '[Effective also in back-up state]' work from there; the unit enters when a field unit falls.","Our guide"],["Word from the game","Skill level (Lv1/Lv2/Lv3 card)","Cards have levels 1-3; two identical adjacent cards merge into one a level higher; merge to Lv3 before casting on a boss; Lv1 casts deal 70% less in Co-op War.","Game text"],["Word from the game","Energy / Ultimate Skill","Skills and Energy Cards fill energy; a full bar lets you cast the team's Ultimate Skill.","Game text"],["Word from the game","Weak","A bar filled by hits from a restricting attribute; full = Stun for 1 turn (bosses may change this).","Game text"],["Word from the game","Stun","Unable to take any actions; the normal result of a full Weak bar; stops counters.","Game text"],["Word from the game","Disruption","Makes the target's active skill ineffective for 1 turn (it may only deal damage); does not stop counters.","Game text"],["Word from the game","Lethal","A state that stops any healing effect from triggering.","Our guide"],["Word from the game","Power Burst","A per-unit trigger; 4★ adds an effect when Power Burst triggers.","Game text"],["Word from the game","Attribute restraint","STR beats SKL, SKL beats SPD, SPD beats STR; PSY and WIT restrict each other; DST restricts all and is only restricted by DST.","Game text"],["Word from the game","STR / SKL / SPD / PSY / WIT / DST","The six attributes (Strength, Skill, Speed, Psyche, Wit, DST); a unit has one.","Game text"],["Word from the game","Faction","No Organization, Aogiri Tree, Anteiku, CCG: every guide team is one faction; faction buffs help only that faction.","Game text"],["Word from the game",":re","A unit tag with its own Tower trial (Trial :re); :re units include Nutcracker, Nishiki [Orochi], Roma [Mad Clown], Black Rabbit, Miza, Urie.","Game text"],["Word from the game","CP (Combat Power)","The power number of a unit or team; CP Enhancement raises account-wide bonuses as your aggregate CP grows.","Game text"],["Word from the game","CP Match","At battle start the teams' CP are compared; a higher CP gives a better chance of acting first (a chance, not a certainty).","Game text"],["Word from the game","Chain Campaign Depth","Your progress in Chain Campaign; it unlocks Assignments, World Boss (15), Attribute Arena (45), RTA (75), Strategic Arena (120) and raises idle rewards.","Game text"],["Word from the game","Chain License","1 per auto-battle in Chain Campaign; 10 a day, reset at 05:00.","Game text"],["Word from the game","Idle Farming","Chain Campaign's passive income: training resources accrue up to a cap; tap the chest before it fills.","Game text"],["Word from the game","Fragment Chest","Chain Campaign chests that open on a timer and drop character fragments; UR chests appear above Depth 60; skipping the timer costs Diamonds.","Game text"],["Word from the game","Stamina","The entry cost of story, Exploration, Conquest and Force Challenge; a failed run costs only 1.","Game text"],["Word from the game","Sweep / Sweep Coupon","Collect a cleared map's rewards at once; unlocked at 20% Exploration progress; Blockade and Assignment sweeps unlock by Depth / VIP.","Game text"],["Word from the game","Conquest Coupon","The attempt currency of Conquest Battle; restored over time; deducted only on victory.","Game text"],["Word from the game","Organization","The guild: Weekly Challenge, Org Boss, shop, auction, Supply, Tech Tree; join an active one on day 1; a 24-hour cooldown after leaving (first exit excepted).","Game text"],["Word from the game","Weekly Challenge","The org's weekly boss for points (5-turn limit); its ranking picks the 8 organizations that enter Stronghold Takeover; finalizes Monday 0:00-5:00.","Game text"],["Word from the game","Organization Boss","A two-phase org fight: Knockback (Monday and Friday refresh) then Bonus Phase rewards.","Game text"],["Word from the game","Auction House","Where Org Boss loot is sold: Org Auction for members (shares for members of 5+ days, max 5%), World Auction for unsold items.","Game text"],["Word from the game","Organization Supply (Orders)","Weekly org orders: turn in items for Gold and a weekly bonus reward.","Game text"],["Word from the game","Organization Tech Tree","Org-wide bonuses researched daily with Gold or Diamonds (24 hours of membership needed); leaders activate them with Organization Funds.","Game text"],["Word from the game","Stronghold Takeover","The Saturday org war (top 8 of the Weekly Challenge): take tiles from your Base, held strongholds earn points, HP stays lost between fights.","Game text"],["Word from the game","Stronghold Annihilation","The follow-up org war for the top 3 organizations: 1 team per battle, a minimum CP per stronghold.","Game text"],["Word from the game","Global Stronghold War","The worldwide org war: qualification by total member CP (top 512), 1-hour battles, phase-specific character bans.","Game text"],["Word from the game","Capture Simulation","The org PvE map with a daily Field Boss and a weekly Siege once a core stronghold is captured.","Game text"],["Word from the game","World Boss","A damage race unlocked at Depth 15: 3 attempts a day, the boss cannot be killed, top 100 and milestones pay.","Game text"],["Word from the game","Carnival","A weeks-long bundle of modes with Carnival Tokens that keep between Carnivals; the first opens on planner day 19.","Game text"],["Word from the game","Carnival Arena","A 3-team best-of-3 arena during the Carnival; 10 attempts a day.","Game text"],["Word from the game","Region Breakthrough","The Carnival dungeon: a locked line-up clears enemy groups you pick, HP carries, weekly modifiers; settles Monday 05:00.","Game text"],["Word from the game","Paragon Team","Carnival Tokens raise a team's Paragon Level (like levels above the cap, Carnival modes only; resets with the Carnival).","Game text"],["Word from the game","Encounter","A 3-player team mode: 3 fights with 3 different line-ups, no unit reused; locked until Monday 05:00.","Game text"],["Word from the game","Twin Campaign","2-player co-op floors; a fully cleared floor gives a permanent stat buff.","Game text"],["Word from the game","Abyssal Battlefield","The weekly rogue-like with one unit (treated as full stars); losing or quitting fails the run; pays Abyss Coins.","Game text"],["Word from the game","Tower Trials","Climbs with entry rules by attribute or faction; each stage pays once.","Game text"],["Word from the game","Force Challenge","A 3-stage run with a locked team and carried HP; a loss costs 1 Stamina.","Game text"],["Word from the game","Blockade Breakthrough","The daily dungeon with chosen buffs; any owned unit may fight; lost HP stays lost; resets daily.","Game text"],["Word from the game","Assignments","Dispatch or fight Bounty Assignments; Urgent Assignments (co-op bosses) trigger after 5-7 Bounties.","Game text"],["Word from the game","Assignment Sale","A limited sale that can trigger around the 9th-16th Bounty; buy only the Gold-priced items.","Game text"],["Word from the game","Exploration","The story maps: fight and open caskets for points; HP is not restored between fights; 20% progress unlocks Sweep.","Game text"],["Word from the game","Reverse Mode","Replays the story from the enemy side against your previous line-up, with its own 3-star goals.","Game text"],["Word from the game","Strong Enemy Assault","Stages with required units; 3 star conditions, best try counts, a loss costs 1 energy.","Game text"],["Word from the game","Arena","1v1 against saved teams: 5 free challenges a day, rank swaps on wins, daily mail at 21:00.","Game text"],["Word from the game","Attribute Arena","Arena for one attribute a week (STR, SKL, SPD in turn; Depth 45); closes Sunday 21:30.","Game text"],["Word from the game","Real-Time Arena (RTA)","Live 1v1 across servers for points (Depth 75); 1 challenge back per hour; rank reset Mondays.","Game text"],["Word from the game","Strategic Arena","Matchmade PvP (day 15, Depth 120) where level, limit, gear and bonds are equalised; only stars and refinement carry.","Game text"],["Word from the game","Pinnacle Showdown / Global Pinnacle Championship","Cross-server tournaments (3v3 gauntlet; the global one 5 teams on forced auto) with group stages, eliminations and a token shop.","Game text"],["Word from the game","Diamond Spring","Daily stake-and-return exchange; 48h pays most; more exchanges a day at higher VIP.","Game text"],["Word from the game","Wishing Sign-in","Daily login where you wish for tomorrow's reward (ready after 05:00); a Grand Reward every 8 sign-ins.","Game text"],["Word from the game","Surprise Sign-In (weekend)","Saturday-to-Monday sign-in: 2 Event Summon Tickets a week; missed days are missed rewards.","Game text"],["Word from the game","Free Monthly Pass (new servers)","100 Diamonds a day for 30 days on new servers.","Our guide"],["Word from the game","Monthly Login Contract","A paid monthly pack; it is what gives Blockade Breakthrough respawns and extra Deconstruction; buy it inside the Diamond Rebate.","Game text"],["Word from the game","VIP","Levels from top-ups only; perks are sweeps, exchanges and stamina; the daily VIP mail never pays Diamonds.","Game text"],["Word from the game","Rebate window","An event that pays back part of a top-up; the guide: spend only inside one; the Diamond Rebate (days 34-55) is the best.","Game text"],["Word from the game","Wish Rebate","A one-purchase offer on a unit you pick (Nutcracker on days 1-7), bargained down by event points; one purchase only.","Game text"],["Word from the game","New Server Carnival","The days 1-14 package: Daily Sign-in, Stamina Sprint, Rebate Project, Recruit Echo.","Game text"],["Word from the game","Shop unit","A unit the shop sells on a known server day (Juzo [CCG Maverick] day 15, Uta [Mask-Maker] day 29, Hideyoshi and Nishiki day 75): never pull for one.","Our guide"],["Word from the game","Arena shop","Buy units first (Noro, Nico, Jason, Naki reach 6★ here), then the monthly duplicate (5,000) and weekly UR cell (2,500).","Our guide"],["Word from the game","Organization shop","Weekly first: the recruitment ticket, the potential ticket and the UR keys; skip Limit Crystals early.","Our guide"],["Word from the game","Abyss shop","The monthly UR tactic chest, then SSR tactic chests; never pay to refresh.","Our guide"],["Word from the game","Random Exchange","A discounted shop with a 30% chance to open on the first login after 05:00; always open from VIP 6.","Game text"],["Word from the game","RC Cell","The gear piece: UR cells can be Modified (path + random skill) and starred to 5.","Game text"],["Word from the game","Modification (cell)","A one-time random skill on a UR cell along a chosen path; materials come from that path's Conquest boss.","Game text"],["Word from the game","Ability Ascension","Consumes full-score all-UR-factor cells; can fail or collapse; builds Luck Value.","Game text"],["Word from the game","Salvage","Breaking down cells for Gold with a chance of Diamonds (more for higher scores).","Game text"],["Word from the game","Potential","A per-unit plate: Exclusive Potentials empower passives; Universal Potentials link by colour; max Lv.6.","Game text"],["Word from the game","Rainbow Potential","Connects to any colour in a Linkage; 0.1% on the Potential Wheel, 1.4% when synthesizing Lv.6.","Game text"],["Word from the game","Potential Wheel","A wheel for random potentials: 1 free spin a day; coins cost Diamonds.","Game text"],["Word from the game","Tactics","Equippable items bought in shops and crafted; same-quality crafts have a 10% chance of a higher quality.","Game text"],["Word from the game","Exclusive Treasure Box / Keys","Keys open boxes for a unit's Ability Sphere; 5 qualities; success raises the next box, failure resets it to N.","Game text"],["Word from the game","Ability Sphere","A unit's exclusive equipment from the Exclusive Treasure Box (R/SR/SSR/UR).","Game text"],["Word from the game","Luck Value","A hidden counter that raises success odds after failures (treasure boxes, Ascension, Deconstruction); resets on the big success.","Game text"],["Word from the game","Coffee","For the illustration collection and Organization Supply; no combat bonus known.","Our guide"],["Word from the game","Tier list","S build around it, A strong in the right team, B useful with limits, C level only, D skip; rated at 0★ and at full stars.","Our guide"],["Word from the game","Meta team","The guide's endgame team per faction (Best teams), with its attack order.","Our guide"],["Word from the game","Server day","Days counted from the server's opening (day 1); the planner's events are on server days, so another server shifts the dates.","Our guide"],["Word from the game","Reset time (05:00 server time)","The day turns over at 05:00 server time: Chain Licenses, Arena challenges, Carnival Arena attempts and sign-ins refresh then.","Game text"],["Word from the game","Deconstruction","A daily free draw (more with the Monthly Contract or VIP) with 4 reward levels; Luck Value 100 guarantees the top one.","Game text"],["Word from the game","Process (Exchange)","Turn lower materials into higher ones of the same type, up to 99 per process.","Game text"],["Word from the game","Bingo","Cards from Assignments (not Urgent) make lines of 4 for rewards; friends can gift cards.","Game text"],["Word from the game","Flame of Friendship","Daily interactions with friends keep a flame lit and earn points.","Game text"],["Word from the game","Hero level cap","The account-wide unit level cap, raised by server day: 200 on day 30, 235 on day 60, 250 on day 77, 280 on day 119.","Our guide"],["Word from the game","Half-cost Stamina","New servers (days 1-28) halve Stamina costs; it covers Force Challenge runs.","Game text"],["Word from the game","Quick Recovery Potion","Revives fallen units in Stronghold modes instantly (Diamonds do too, at a rising price); each use gives Revival Points.","Game text"],["Word from the game","Org-hopping","Joining a stronger organization for its Saturday payout and coming back; the agent's orgplan tool has the calendar.","Our guide"],["How a system works","Scenes (CG collection) and the Scene calculator","91 scenes in 6 groups (All Characters: 12, All Characters (New): 18, Anteiku: 14, Aogiri: 14, CCG: 19, No Org: 14). Each scene levels up with Scene points and gives a flat stat to a faction (or all characters); organization and rarity requirements gate the higher levels. Faction scenes only boost that faction, so pour points into the faction you actually field. Full per-level table: data/sources/gluttony_db_latest.json -> scenes.","Game text (gluttony.dev, SEA 13368)"],["How a system works","RC Cell modification rolls (cell calculator)","Modification: 4 slots, 3 options offered per round, 30 rounds. Starting values ATK 30, DEF 25, HP 160. Caps per line: AtkFixed 700, DefFixed 550, HpFixed 11000, AtkRate 0.016, DefRate 0.016, HpRate 0.016, Crit 0.035, Uncrit 0.035, CritDeepen 0.04, UncritDeepen 0.04, Block 0.04, Unblock 0.04, Suck 0.03, Regeneration 0.03, GetCured 0.03. Crit/CritDeepen/Block lines cap at 3.5-4%; ATK% lines cap at 1.6%, so on a damage dealer CRIT DMG (CritDeepen) and Crit are the lines to keep.","Game text (gluttony.dev, SEA 13368)"],["How a system works","Level caps, rank-up levels and stat growth","Rank-up (breakthrough) levels for an SSR: [55, 80, 110, 145, 300]. Level caps run 30 -> 500. Growth multiplier by rarity: {\"1\": 1, \"2\": 1, \"3\": 1.02, \"4\": 1.12, \"5\": 1.12, \"6\": 1.13, \"7\": 1.13, \"8\": 1.15, \"9\": 1.15, \"55\": 1.15}. Potential slots: 9; potential tiers 6/7 add {\"6\": {\"Atk\": 300, \"Def\": 255, \"Hp\": 4715}, \"7\": {\"Atk\": 400, \"Def\": 340, \"Hp\": 6300}}. Every unit's own caps are in its 'gdb.levelCaps'; breakthrough talents per tier in 'gdb.breakthrough'.","Game text (gluttony.dev, SEA 13368)"],["How a system works","Bond stats","Bond gives ATK +50, DEF +40, HP +1350 per level, up to level 30.","Game text (gluttony.dev, SEA 13368)"],["How a system works","Stronghold (GvG) maps","3 Stronghold maps in the game data: gvg_map_0401: 2983 tiles, 61 special tiles, labels: S, t, r, o, n, g, h, o, l, d, , T, a, k, e, o, v, e, r; gvg_map_0601: 2983 tiles, 61 special tiles, labels: G, l, o, b, a, l, , G, V, G, ,, , p, h, a, s, e, s, , 1, , a, n, d, , 2; gvg_map_0501: 2206 tiles, 92 special tiles, labels: G, l, o, b, a, l, , G, V, G, ,, , p, h, a, s, e, s, , 3, , a, n, d, , 4. The interactive planner is gluttony.dev/stronghold/.","Game text (gluttony.dev, SEA 13368)"],["How a system works","Recent patches (game data)","SEA 3-13368 (2026-11-12): changed 1155, 1160, 1180, 1181; new heroes -; new cells - | SEA 3-13332 (2026-11-10): changed 1181; new heroes -; new cells - | SEA 3-13283 (2026-11-05): changed 1150, 1179, 1180; new heroes 1115, 1181; new cells - | SEA 3-13221 (2026-11-02): changed 1161; new heroes -; new cells - | SEA 3-13187 (2026-10-31): changed 1155, 1179; new heroes -; new cells - | SEA 3-13168 (2026-10-30): changed 1144; new heroes -; new cells -","Game text (gluttony.dev, SEA 13368)"]]},{"id":"boss-and-war-rules","tab":"Boss and war rules","title":"Boss and war rules","what":"The game's own rule text for the World Boss, Org Boss, Weekly Challenge, Conquest and the Stronghold wars.","how":"This is archived text. A live boss can override it, so always read the boss info screen in the game as well.","group":null,"cols":[{"h":"Mode","hint":"","img":null,"w":46.1,"kind":"","bold":true,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null},{"h":"Rule","hint":"","img":null,"w":181.9,"kind":"","bold":false,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null},{"h":"From","hint":"","img":null,"w":22,"kind":"","bold":false,"dim":true,"center":false,"pct":false,"x":false,"islink":false,"label":null}],"rows":[["Weekly Challenge (org)","Defeating enemies in Weekly Challenge to earn Weekly Challenge Points. Earning points will grant rewards at certain thresholds. Point Rewards are refreshed each week.","Game text"],["Weekly Challenge (org)","Players can switch the difficulty level of the challenge at any time. The higher the difficulty, the higher the point bonus; points between levels of difficulty will not be accumulated; you will only be rewarded based on the highest number of points","Game text"],["Weekly Challenge (org)","You can borrow characters from fellow Organization members in Challenge, but this action will affect the points you can earn.","Game text"],["Weekly Challenge (org)","Weekly Challenge has a turn limit. On any difficulty, failing to defeat all enemies within 5 turns results in battle failure.","Game text"],["Weekly Challenge (org)","Base Points =500+ Total Damage *0.004+ Best Single Damage *0.005+ Total Attribute Restraint Damage *0.0065","Game text"],["Weekly Challenge (org)","Your points are reduced by 20% for each borrowed character.","Game text"],["Weekly Challenge (org)","· The rankings will be finalized weekly from 0:00 AM to 5:00 AM %utc% every Monday. The Challenge Points earned during the finalization period will not be included in the calculation.","Game text"],["Weekly Challenge (org)","Join an active organization on day 1. Only the top 8 organizations in that week's Weekly Challenge can enter guild war.","Our guide"],["Weekly Challenge (org)","Weekly Challenge (Organization, untested plan): Weak: Changes your Weak cap to 6 as battle starts. Weak effect increases the skill level of all Skills of 1 random enemy instead of Stunning you. DMG Increase: When an enemy target uses a triggered Skill, grants self with an effect of a 20% increase in damage taken, stacking up to 5 times. Retaliation: When your turn starts, grant yourself a 15% increase in ATK-related stats,stacking up to 3 times, and deal [Blood Piercer] damage of 120% ATK to an random debuffed enemy || *Blood Piercer: When attacked, the target takes additional damage of 10% of Blood Piercer applier's ATK for 2 turns.","Our guide"],["Weekly Challenge (org)","# Weekly Challenge (mode id boss-weekly) cite: mode:boss-weekly (the fight) or mode:boss-weekly#N (row N below) Tip: You get 5 turns, and only your best run counts. Tip: Use units that beat its attribute: that damage scores the most. Tip: Hit hard while it is above 50% HP, and use area attacks (+50%). Boss mechanics are the game's own text, written from the boss's side: his \"allies\"/\"allied Character\" are the boss's side (his parts and adds), \"enemies\" are your team. Boss mechanic — Weak: Changes your Weak cap to 6 as battle starts. Weak effect increases the skill level of all Skills of 1 random enemy instead of Stunning you.","Our guide"],["Organization Boss","The Organization Boss game is divided into two Phases: Knockback Phase and the Bonus Phase.","Game text"],["Organization Boss","The Knockback Phase refreshes every Monday and Friday. You can only enter the Bonus Phase after defeating a Boss.","Game text"],["Organization Boss","The Bonus Phase lasts from the moment the Boss is defeated until the next Knockback Phase refresh. The longer the Bonus Phase lasts, the greater the potential rewards, so work together with your team to defeat the Boss as quickly as possible!","Game text"],["Organization Boss","In Knockback Phase, players need to defeat the Organization Boss as soon as possible to get Points. The fewer days it takes to complete Knockback, the higher the Point bonus.","Game text"],["Organization Boss","Random Battle Buff drops when enemy HP drops to a specific phase.","Game text"],["Organization Boss","Each member can only use one Buff at a time; members can also borrow from each other.","Game text"],["Organization Boss","During the Bonus Phase, the progress of receiving rewards will increase over time. When the progress is complete, all members of the Organization can receive rewards.","Game text"],["Organization Boss","Organization Boss: Yoshimura (Organization, untested plan): Sweeping Slash: Deals [Blade] damage to all enemies equal to 220% of ATK. || *Blade: CRIT Rate increases by 1% for every 2% of HP lost of the enemy Sweeping: Deals [Impale] damage equal to 200% of ATK to all enemies, granting your other allies a Shield of 15% of the damage dealt for 1 turn. || *Impale: This damage ignores the target's DEF. Fragile Attack: Deals [Smite] damage equal to 300% of ATK to the enemy target, applying [Fragile Mark] to the target for 2 turns if the target is not in any Stances. || *Smite: Ignores DEF and Block Chance for this damage *Fragile Mark: Damage taken is always considered as CRIT","Our guide"],["Organization Boss","See the record kbm:org_boss (sourced research with labels per line).","Our guide"],["World Boss","·When the player's Chain Campaign Depth reaches Lv.15, the World Boss will be unlocked.","Game text"],["World Boss","·Players have 3 chances to challenge the Boss every day, and no deduction of chances if they quit halfway.","Game text"],["World Boss","·The Boss cannot be killed. After a certain period of time, the Boss will leave.","Game text"],["World Boss","·Each time you challenge the Boss, you will get some reward.","Game text"],["World Boss","·When the accumulative damage caused to the Boss reaches a certain level, you will receive corresponding rewards.","Game text"],["World Boss","·After the boss leaves, the finalization begins. The top 100 players who have caused most accumulative damage to the Boss will receive rewards.","Game text"],["World Boss","World Boss (Damage race): Attack daily: you get 3 attempts a day, and every challenge pays a reward. Aim for damage milestones; single-battle and accumulated damage both pay. Remember the boss can't be killed; it leaves after a while and the top 100 get ranking rewards. Tip: Quitting halfway doesn't use an attempt.","Our guide"],["World Boss","World Boss 1: Bin Brothers (STR) (World Boss, untested plan): Bonus-Attack: When your turn starts, deal 220% ATK damage to enemy target with the lowest percentage of HP, and additionally deal damage equals to 5% of target’s max HP. Restrict Underbelly: When receiving damage from restricting Attribute, you will be granted an effect of 15% reduction in DEF-related stats. Stacking up to 5 times.","Our guide"],["World Boss","World Boss 2: Tatara (SKL) (World Boss, untested plan): Shield Effect: When your turn ends, grant self a shield equal to 20% of the total damage received in the previous turn. Lasts for 1 turn. Shield Retaliation: After the shield effect disappears or breaks, deal 260% of the enemy's ATK to the target with the highest ATK, ap
