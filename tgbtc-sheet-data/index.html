plying [Lethal] for 1 turn. || *Lethal: Unable to trigger any healing effects. Restriction Boost: When receiving damage from restricted Attribute, you will be granted an effect of 5% increase in ATK-related stats. Stacking up to 5 times.","Our guide"],["World Boss","World Boss 3: Kureo Mado (SPD) (World Boss, untested plan): Attack Boost: When your turn starts, you will be granted an effect of increase in ATK-related stats by 10% and enemies will be granted an effect of reduction in DEF-related stats by 10%. Stacking up to 3 times. Debuff Retaliation: When taking active Skill damage, if the attacker has debuffs, Retaliate the target, causing [Underbelly] damage equal to 180% of your ATK. || *Underbelly: If the target is debuffed, this damage will be increased by 15% Disabling Boost: When any enemy target dies, deal damage of 160% ATK to the enemy target with the highest ATK, applying [Stun] for 1 turn. || *Stunned: Unable to take any actions.","Our guide"],["World Boss","[gj:mode:worldboss] World Boss (Damage race): how the mode works (the guide site's own data: guide.json as of October 19, 2026, updated October 27, 2026). unlock: Chain Campaign Depth 15 why: steps: - Attack daily: you get 3 attempts a day, and every challenge pays a reward. - Aim for damage milestones; single-battle and accumulated damage both pay. - Remember the boss can't be killed; it leaves after a while and the top 100 get ranking rewards. team: Team 1 with your highest damage. tip: Quitting halfway doesn't use an attempt. region: archive; confirm your server; as of 2026-09-22; verification: player/client confirmation required","Our guide"],["Stronghold Takeover (guild war)","·Stronghold Takeover will be opened along with Carnival","Game text"],["Stronghold Takeover (guild war)","·After the event officially starts, you can start from the Base to occupy Strongholds. The Base cannot be attacked.","Game text"],["Stronghold Takeover (guild war)","·After occupying a Stronghold, the Stronghold will start to increase its reward progress. When the designated reward progress is reached, rewards will be distributed to all members of the Organization occupying the Stronghold at that time.","Game text"],["Stronghold Takeover (guild war)","·From time to time, Stronghold Points will be issued based on the number and level of Strongholdes currently occupied by the Organization. At the end of the Event, the occupied Strongholdes will also provide a portion of Stronghold Points","Game text"],["Stronghold Takeover (guild war)","·Occupy a Stronghold of another Organization to compete for the Stronghold Points stored there.","Game text"],["Stronghold Takeover (guild war)","·The battle for the Stronghold requires the use of Teams to fight. When a Team participates in the battle, the HP consumed in the battle will not be restored immediately","Game text"],["Stronghold Takeover (guild war)","·Before the preparation phase starts, only the top 8 organizations in the Weekly Challenge rankings within the server are eligible to participate in the Stronghold Takeover.","Game text"],["Stronghold Takeover (guild war)","·Before the official start of the Stronghold Takeover, a preparation phase will begin. During this phase, you can perform operations such as deploying formations and viewing map info.","Game text"],["Stronghold Takeover (guild war)","server days 20-20: First possible guild war (Stronghold Takeover), Sat. Only the top 8 orgs in that week's Weekly Challenge enter. Prep 10:00, battle 12:00–15:00 server time [game data] [inferred: first Saturday after Carnival opens].","Our guide"],["Stronghold Takeover (guild war)","Join an active organization on day 1. Only the top 8 organizations in that week's Weekly Challenge can enter guild war.","Our guide"],["Stronghold Takeover (guild war)","Pick one faction and build its strongest team first. No Org is the cheapest start. Guild War: one strong team, plus two 1–2 character teams that only grab free tiles. Save 90,000 Diamonds for one limited banner you can finish (300 pulls). You never have to spend money. If you do, buy inside a rebate window.","Our guide"],["Stronghold Takeover (guild war)","Global Stronghold War (no team rows in the guide for this fight): Some phases ban some characters. Plan: Check the ban list when each phase starts. A banned unit must leave your team before you can fight. Bans apply only in that phase and region, not in other modes. Keep a second strong team ready for the phases that ban your carry.","Our guide"],["Stronghold Takeover (guild war)","[gj:mode:stronghold] Stronghold Takeover (Guild War) (Organization war, Saturdays): how the mode works (the guide site's own data: guide.json as of October 19, 2026, updated October 27, 2026). unlock: Opens with the Carnival. Only the top 8 Organizations in this server's Weekly Challenge ranking can enter; the check is when preparation starts. why: Your Organization's biggest weekly payout: Diamonds and Cell Promoter for holding strongholds, and Carnival Summon Tickets and Talent Certificates for rank. steps: - Saturday: preparation from 10:00, battle 12:00–15:00, rank rewards at 15:00 (server time). - Each player sets 3 teams. You start from your Base, which can't be attacked, and can only attack tiles next to ones you hold. - You start with 10 attack charges and get 1 more every 20 minutes. You can buy 19 more for 2,790 Diamonds in total; the first 3 cost 50 each. - Every stronghold you hold earns points every 5 minutes. Strongholds still yours at the end pay a final share. - Taking another Organization's stronghold steals 50% of the points stored there. - Lost HP stays lost between fights and comes back slowly outside battle. Fallen characters recover slowly, or you revive them","Our guide"],["Stronghold Annihilation","The Stronghold Annihilation opens with the Carnival\\n·Only Top 3 organizations from the weekly Stronghold Takeover can participate.\\n·Before the event starts, there is a Preparation Phase where you can set lineups and view the map","Game text"],["Stronghold Annihilation","·Once the event begins, you can send teams to attack different strongholds. Defeat defenders to earn Annihilation Points and rewards based on rankings\\n·Strongholds have multiple levels with different defender counts, CP, and rewards\\n·Each stronghold has a required CP. Teams below this cannot attack the stronghold\\n·When all defenders of a stronghold are defeated, the stronghold is settled. Organizations are ranked by total Annihilation Points from their members","Game text"],["Stronghold Annihilation","The Stronghold Annihilation uses 1 team per battle. HP lost in battle is not restored immediately\\n·It takes time for characters who died in battle to recover. The consumed HP will slowly recover after some time outside the battle\\nDiamonds and Quick Recovery Potion can be used to revive team members. If the team is revived continuously, the consumed Diamonds will increase\\nUsing Quick Recovery Potions or Diamonds for instant revival will grant Revival Points corresponding to the cost. Exchange Revival Points in the exclusive Revival Point Shop for items","Game text"],["Stronghold Annihilation","Stronghold Annihilation (Organization war (top 3 only)): Set your lineups and study the map during the Preparation Phase. Send a team at a stronghold; each battle uses 1 team. Check each stronghold's required CP and attack the highest-level one your team qualifies for. Defeat defenders for Annihilation Points; rewards follow the rankings. Rotate teams: lost HP is not restored right away, and fallen units recover slowly (Diamonds or Quick Recovery Potions revive instantly). Tip: Only revive with Diamonds when your Organization calls a push.","Our guide"],["Stronghold Annihilation","Stronghold Annihilation (no team rows in the guide for this fight): 1 team per battle, and each stronghold has a minimum CP. Plan: Only the top 3 organizations from the weekly Stronghold Takeover enter. Each battle uses 1 team, and each stronghold has a minimum CP. Send your strongest sustain team at the highest stronghold its CP lets in. (unconfirmed) HP carries over: revive only a team that passes a CP gate. (unconfirmed)","Our guide"],["Stronghold Annihilation","[gj:mode:annihilation] Stronghold Annihilation (Organization war (top 3 only)): how the mode works (the guide site's own data: guide.json as of October 19, 2026, updated October 27, 2026). unlock: Opens with the Carnival; only the top 3 Organizations from that week's Stronghold Takeover. why: A second Saturday war for the top 3. It pays Potential Lucky Coins and Limit Crystals. steps: - Saturday after Takeover: preparation 15:30, battle 16:00–17:00 (server time). - Set your line-ups and study the map during preparation. - Each battle uses 1 team. Each stronghold has a required CP: a team below it can't attack. - Defeat defenders for Annihilation Points. When a stronghold's defenders are all beaten, it pays out by each Organization's rank there. - Lost HP is not restored right away. Fallen characters come back after a wait (1,200 s in the game settings), or revive at once with Diamonds or Quick Recovery Potions. team: tip: Only revive with Diamonds when your Organization calls a push. region: game text of September 22, 2026; confirm on your server; as of 2026-10-27; verification: player/client confirmation required","Our guide"],["Conquest Battle and Formidable bosses","· In Conquest Battle, you should formulate tactics according to the characteristics of the enemy","Game text"],["Conquest Battle and Formidable bosses","· During the battle, if you strike at the enemy's weak points, you can earn additional rewards when the battle is won","Game text"],["Conquest Battle and Formidable bosses","· Starting Conquest Battle costs stamina. Failing costs only 1 Stamina","Game text"],["Conquest Battle and Formidable bosses","· Conquest Coupons are restored over time. No attempt will be deducted unless you claim victory.","Game text"],["Conquest Battle and Formidable bosses","·After clearing [Yamori] Conquest - Abyss, you will unlock the challenge of difficulty Formidable. To unlock the subsequent Formidable BOSS, you need to clear the previous Formidable BOSS","Game text"],["Conquest Battle and Formidable bosses","·You can invite other players online to challenge Formidable BOSS together","Game text"],["Conquest Battle and Formidable bosses","·Challenges do not consume Stamina","Game text"],["Conquest Battle and Formidable bosses","When a certain number of teams successfully complete the Formidable Challenge in this server, players can receive rewards.","Game text"],["Conquest Battle and Formidable bosses","Conquest Battle (bosses) and Formidable (Boss dungeon (co-op)): Read the boss's characteristics, then set a team that answers them. Strike the boss's weak points during the fight for extra rewards. Invite other players to fight together if you can't solo it. Only spend attempts you can win: Conquest Coupons are deducted only on victory, and a failed start costs just 1 Stamina. For Formidable bosses (no Stamina cost), clear them in order; server-wide clear counts unlock bonus rewards. Tip: Farm the boss of the Modification path you chose for Nutcracker's cells (then Rize's).","Our guide"],["Conquest Battle and Formidable bosses","Bring attributes that beat the boss: STR beats SKL, SKL beats SPD, SPD beats STR. Merge skill cards to Lv3 before you cast. Stun and full Weak stop counters; Disruption does not.","Our guide"],["Conquest Battle and Formidable bosses","[gj:mode:conquest] Conquest Battle (bosses) and Formidable (Boss dungeon (co-op)): how the mode works (the guide site's own data: guide.json as of October 19, 2026, updated October 27, 2026). unlock: Story progress; Formidable after clearing [Yamori] Conquest - Abyss why: Drops Modification materials for UR cells (each Modification path has its own boss). steps: - Read the boss's characteristics, then set a team that answers them. - Strike the boss's weak points during the fight for extra rewards. - Invite other players to fight together if you can't solo it. - Only spend attempts you can win: Conquest Coupons are deducted only on victory, and a failed start costs just 1 Stamina. - For Formidable bosses (no Stamina cost), clear them in order; server-wide clear counts unlock bonus rewards. team: Team 1. Bring Yakumo [Jason] against bosses that heal. tip: Farm the boss of the Modification path you chose for Nutcracker's cells (then Rize's). region: archive; confirm your server; as of 2026-09-22; verification: player/client confirmation required","Our guide"],["Global Stronghold War","During the event, players can participate in the Global Stronghold War, competing with top organizations worldwide for strongholds and rankings. In addition to stronghold battles, the event will also feature Event Sign-in, Event Prediction, Commemorative Shop, and Event Pass. Players can earn exclusive event rewards by participating.","Game text"],["Global Stronghold War","Each Stronghold Battle lasts 1 hour, and all battlefield groups worldwide will open simultaneously at the designated time.","Game text"],["Global Stronghold War","To ensure fair play, different event phases may have different character bans.","Game text"],["Global Stronghold War","Banned characters cannot be placed into stronghold battle teams. If a banned character is already in the player's current team, they must replace the character before participating in battle.","Game text"],["Global Stronghold War","Character ban rules only take effect during the corresponding event phase and in designated regions, and do not affect the normal use of characters in other game modes.","Game text"],["Global Stronghold War","The Global Stronghold War schedule consists of the following phases: Qualification Ranking, Qualifiers, Promotion Matches, Knockout Matches, and the Championship.","Game text"],["Global Stronghold War","After the Global Stronghold War event opens, the system will tally the total combat power of all organization members worldwide and conduct qualification rankings based on the total combat power of organization members.","Game text"],["Global Stronghold War","When the Qualification Ranking concludes, the top 512 organizations will qualify for the Qualifiers.","Game text"],["Global Stronghold War","Global Stronghold War (no team rows in the guide for this fight): Some phases ban some characters. Plan: Check the ban list when each phase starts. A banned unit must leave your team before you can fight. Bans apply only in that phase and region, not in other modes. Keep a second strong team ready for the phases that ban your carry.","Our guide"]]},{"id":"patch-log","tab":"Patch log","title":"Patch log","what":"The latest versions of the game data and which characters changed in each one.","how":"If the newest version here is older than the one shown on gluttony.dev, this book is out of date: ask for a fresh copy.","group":null,"cols":[{"h":"Game data version","hint":"","img":null,"w":22,"kind":"","bold":true,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null},{"h":"Date","hint":"","img":null,"w":14,"kind":"","bold":false,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null},{"h":"Characters that changed","hint":"","img":null,"w":138.5,"kind":"","bold":false,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null},{"h":"New characters","hint":"","img":null,"w":75.5,"kind":"","bold":false,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null}],"rows":[["SEA 3-13368","2026-11-12","Ayato Kirishima [Black Rabbit], Toka Kirishima [Flame Strike], Hinami Fueguchi [Halloween], Haise Sasaki [2nd Anniversary]","—"],["SEA 3-13332","2026-11-10","Haise Sasaki [2nd Anniversary]","—"],["SEA 3-13283","2026-11-05","Haise Sasaki [Sealed Memory], Miza Kusakari [Triple Blade], Hinami Fueguchi [Halloween]","Seido Takizawa [OWL], Haise Sasaki [2nd Anniversary]"],["SEA 3-13221","2026-11-02","Ayato Kirishima [1.5th Anniversary]","—"],["SEA 3-13187","2026-10-31","Ayato Kirishima [Black Rabbit], Miza Kusakari [Triple Blade]","—"],["SEA 3-13168","2026-10-30","Hinami Fueguchi [Hina Matsuri]","—"]]},{"id":"sources","tab":"Sources","title":"Sources","what":"Every website and table the numbers come from.","how":"When the game updates, these are the places to re-check.","group":null,"cols":[{"h":"Source","hint":"","img":null,"w":33.9,"kind":"","bold":true,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null},{"h":"Link","hint":"","img":null,"w":46.6,"kind":"","bold":false,"dim":false,"center":false,"pct":false,"x":false,"islink":true,"label":null},{"h":"What it has","hint":"","img":null,"w":105.9,"kind":"","bold":false,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null},{"h":"Used for","hint":"","img":null,"w":63.6,"kind":"","bold":false,"dim":true,"center":false,"pct":false,"x":false,"islink":false,"label":null}],"rows":[["gluttony.dev","https://gluttony.dev/","Character database from the game files: stats at level 1 and max, max CP, skills, talents, release dates, its own tier list, cell calculator, patch list.","Tabs 01-09, 19. Re-check after every game update (the site shows the data version)."],["gluttony.dev Stronghold planner","https://gluttony.dev/stronghold","Guild war maps and planner.","War planning."],["Broken Chains data site","https://btc-web-863ee.web.app/","Game tables: summon banners and rates, rewards, event calendar with pack prices, patch notes.","Tabs 10, 10b, 11, 12."],["tkgbtc.com","https://tkgbtc.com/","Hero data and client text tables (skills, constants, gear).","Tabs 05, 06, 15, 17, 20-22."],["Org guide","https://xyukiterux.github.io/guides/","Our own guide: tiers, teams, calendar, economy, rules, each with its source.","Tabs 01 (tiers), 12, 14, 16, 17."],["Player hub","https://xyukiterux.github.io/reports/tgbtc/","Per-player plans.","Reference only."],["Creator videos","https://www.youtube.com/","Team screens and tips: Shi, Aslan, Kitcat, Sandro, Guff, Black_Assasine12, ZoltanVidakF2P and others. Every row in tab 13 links the exact video and second.","Tab 13."],["In-game screens","","The only source for: VIP EXP per level, Diamond top-up prices, shop prices and limits, current boss rules.","Fill the NOT KNOWN YET rows in tab 12."]]},{"id":"change-log","tab":"Change log","title":"Change log","what":"A running list of what changed in this book and when.","how":"Add a line every time you change something.","group":null,"cols":[{"h":"Date","hint":"","img":null,"w":14,"kind":"","bold":false,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null},{"h":"What changed","hint":"","img":null,"w":149.5,"kind":"","bold":false,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null},{"h":"Source","hint":"","img":null,"w":66.5,"kind":"","bold":false,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null},{"h":"By","hint":"","img":null,"w":20,"kind":"","bold":false,"dim":false,"center":false,"pct":false,"x":false,"islink":false,"label":null}],"rows":[["2026-11-12","Data book built from game data SEA 13368 (built 2026-11-12)","see Sources",""]]}],"nav":[["New here? Start with this.","How to read this","A one-page walk-through with one character followed across every page."],["Who is this character, and is it any good?","Characters","Every character with its picture, org, grade and how to get it."],["How strong does it get?","Stats","Attack, Defense, Health and Power at level 1 and at the top level, strongest first."],["Is another copy worth it?","Stars","What each star (extra copy) unlocks for every character."],["What do its skills actually do?","Skills","The skill card and every passive in the game's own words, with the damage numbers."],["Which org is the strongest?","Org power","Average and best-5 power per org, a chart over time and a simple projection."],["Can I afford this banner?","Pull calculator","Type in your Diamonds and income. It answers YES or NO."],["What are the pull chances and costs?","Banners","Every banner: price per pull, featured characters, when the guarantee arrives."],["Where do Diamonds come from?","Diamonds","Income by source, paid cards, VIP gifts, what to buy and what to skip."],["What are the top players running?","Meta teams","Teams from creator videos by month, with pictures and a link to the exact moment."],["What opens on which day?","Calendar","Banners, shops and level caps by server day."],["How does a game mode work?","Game modes","Each mode in a few plain steps."],["What does this word or system mean?","Rules and words","Short explanations of every system plus the game's glossary."],["What are the boss and guild war rules?","Boss and war rules","The game's own rule text for bosses and Stronghold wars."],["Which character came out when?","Power timeline","Every SSR and UR by release date with its top power."],["What changed in the last patches?","Patch log","Game data versions and which characters changed."],["Where does all this come from?","Sources","Every website and table behind the numbers."]],"words":[["Org","The side a character belongs to: No Organization, Anteiku, Aogiri Tree or CCG. Teams are built from one org because their bonuses only help their own org."],["Attribute","STR, SKL, SPD, PSY, WIT or DST. STR beats SKL, SKL beats SPD, SPD beats STR. PSY and WIT beat each other."],["Rarity","How rare a character is. UR is the rarest, then SSR, SR and R."],["Attack / Defense / Health","The three basic stats. Attack is how hard it hits, Defense is how much damage it shrugs off, Health is how much damage it can take."],["Power (CP)","Combat power: one number the game uses to sum up how strong a character is. Higher is stronger."],["Top level","Level 500 with everything maxed. It is the ceiling in the game files; servers open higher level caps over time, so no account is there yet. Use it to compare characters with each other."],["Stars","Each extra copy of a character adds one star (up to 6). Stars unlock passives and raise stats."],["Passive","An effect that works by itself, without playing a card."],["Skill card","The attack a character plays in battle. Two matching cards merge into a stronger level (1, 2, then 3)."],["Back-up","The 5th team slot. A back-up does not fight; only passives that say they work from back-up apply."],["Guarantee (pity)","The pull count at which a banner hands you the featured character for sure. The count does not carry over to another banner."],["Legacy / Carnival / limited","Banner types. Legacy lets you pick the character. Carnival costs 600 Diamonds a pull instead of 300. Limited banners run for a short time."],["Diamonds","The premium currency. 300 Diamonds = one pull on most banners."],["Server day","How many days your server has existed. New servers unlock banners, shops and level caps on fixed server days."]],"good":["Level 1 and top-level numbers are exact. Numbers for the levels in between are not in this book, because the game does not publish how it calculates them.","Real-money prices for Diamonds, and what each VIP level costs, are not in any public data. They can only be read from the in-game shop and VIP screens.","Dates on banners come from the first servers that ran them. A newer server follows the Calendar page, which goes by server day.","Top-level power is a ceiling. Real accounts sit far below it, so use it to compare characters and orgs, not to predict a fight.","Boss rules are archived game text. A live boss can change them, so read the boss info screen in the game too.","Grades are opinions. Two grade lists are shown side by side so you can see where they disagree.","The gold projection on Org power is a straight line through past numbers. It starts a conversation; it does not predict the future."],"org":"<div class=\"two\"><div><div class=\"tw\"><table class=\"plain\"><tr><th>O  else{h=esc(v).replace(/\n/g,'<br>');if(c.center)cls.push('c');

 M.querySelectorAll('.q').forEach(d=>d.onclick=()=>{location.hash=d.dataset.k})}
function how(){
 const st=[['Pick a page from the bar at the top.','Home lists every page as a question, like "How strong does it get?".'],['Every page starts with two lines.','"What this is" tells you what the page shows. "How to use it" tells you what to do with it.'],['The small words under a red column name explain that column.','If a column name is unclear, read the small words under it.'],['Search, filter and sort.','Type a name in the search box, pick an org from the list, or click a red column name to sort by it. Click again to flip the order.'],['One row is one thing.','On Characters, Stats and Stars one row is one character. On Skills one row is one skill. On Meta teams one row is one team.'],['Want it in Excel?','Press "Download as Excel" at the top right. The Excel file has the same pages, already coloured and laid out.']];
 const col=[['o0','No Organization','Purple = a No Organization character.'],['o1','Anteiku','Green = an Anteiku character.'],['o2','Aogiri Tree','Red = an Aogiri Tree character.'],['o3','CCG','Blue = a CCG character.']];
 const fo=[['var(--green)','Fact, straight from the game files','Stats, power, skill and passive text, star unlocks, banner prices and pull chances, level caps, release dates, rule text.'],['var(--blue)','Seen, not judged','Meta teams: teams creators really ran in their videos. It shows what is popular, not a promise that it is best.'],['var(--gold)','Opinion','Grades (S to D), short verdicts and the buy / skip list. Two grade lists are shown side by side so you can see where they disagree.'],['#ff6b73','A guess','The gold projection row on Org power. It is a straight line through past numbers.']];
 M.innerHTML='<h2>How to read this book</h2><div class="box"><p>One page, two minutes. After this, every other page will make sense.</p></div><h3>The basics</h3>'+st.map((s,i)=>'<div class="step"><i>'+(i+1)+'</i><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div>').join('')+
 '<h3>What the colours mean</h3>'+col.map(c=>'<div class="kv"><b class="'+c[0]+'">'+c[1]+'</b><span>'+c[2]+'</span></div>').join('')+'<div class="kv"><b><span class="g gS">S</span> <span class="g gA">A</span> <span class="g gB">B</span> <span class="g gC">C</span> <span class="g gD">D</span></b><span>Grades. Gold S is the best; grey D means skip.</span></div><div class="kv"><b>Gold</b><span>Something uncertain: a projection or "not known yet". On the Pull calculator, a box you type in.</span></div>'+
 '<h3>What is fact and what is opinion</h3>'+fo.map(f=>'<div class="kv"><b style="color:'+f[0]+'">'+f[1]+'</b><span>'+f[2]+'</span></div>').join('')}
function org(){M.innerHTML='<h2>Org power</h2><div class="box"><p><b>WHAT THIS IS</b> &nbsp;Which org has the strongest characters, counting every SSR and UR at its top-level power.</p><p class="dim"><b>HOW TO USE IT</b> &nbsp;The first table is the average today. The second table and the chart show how each org\'s five strongest characters have grown since launch. The orgs are close, so a few thousand points is a real lead.</p></div>'+D.org}
function calc(){
 const I=[['d','Diamonds you have now',12000,''],['t','Summon tickets you have now',10,'Tickets that work on this banner.'],['inc','Diamonds you earn per day',940,'A free player earns about 940 a day in the first month. Count your own for a few days.'],['p','Price of one pull, in Diamonds',300,'300 on most banners. 600 on Carnival banners.'],['need','Pulls needed for the guarantee',300,'300 on a limited banner. 200 on rate-up and Legacy banners.'],['done','Pulls you already made on this banner',0,'The count does not carry over to another banner.'],['days','Days left before the banner ends',14,''],['fr','Chance of the featured character per pull, in %',1,'Usually 1% in total for the featured characters.']];
 const O=[['can','Pulls you can make today'],['miss','Pulls still missing for the guarantee'],['dn','Diamonds you still need to save'],['dy','Days of saving that takes'],['ssr','Chance of at least one SSR from today\'s pulls'],['ft','Chance of the featured character from today\'s pulls']];
 M.innerHTML='<h2>Pull calculator</h2><div class="box"><p><b>WHAT THIS IS</b> &nbsp;A quick check before you spend. It tells you whether you can reach a banner\'s guarantee before the banner ends.</p><p class="dim"><b>HOW TO USE IT</b> &nbsp;Type your own numbers into the gold boxes. The answer updates as you type.</p></div><div class="calc"><div><div class="band">Your numbers</div>'+I.map(i=>'<div class="row"><div>'+esc(i[1])+(i[3]?'<small>'+esc(i[3])+'</small>':'')+'</div><input id="i_'+i[0]+'" type="number" min="0" step="any" value="'+i[2]+'"></div>').join('')+'</div><div><div class="band">Your answer</div>'+O.map(o=>'<div class="row"><div>'+esc(o[1])+'</div><div class="out" id="o_'+o[0]+'"></div></div>').join('')+'<div class="verdict"><div class="v" id="v"></div><div><b>Can you reach the guarantee in time?</b><div id="vt" class="dim"></div></div></div></div></div>';
 const g=k=>Math.max(0,parseFloat(document.getElementById('i_'+k).value)||0),set=(k,v)=>document.getElementById('o_'+k).textContent=v;
 function run(){const can=Math.floor(g('d')/Math.max(g('p'),1))+g('t'),miss=Math.max(0,g('need')-g('done')),dn=Math.max(0,(miss-g('t'))*g('p')-g('d')),dy=g('inc')>0?Math.ceil(dn/g('inc')):Infinity;
  set('can',can.toLocaleString());set('miss',miss.toLocaleString());set('dn',dn.toLocaleString());set('dy',isFinite(dy)?dy.toLocaleString():'never');set('ssr',Math.round((1-Math.pow(0.97,can))*100)+'%');set('ft',Math.round((1-Math.pow(1-g('fr')/100,can))*100)+'%');
  const ok=dy<=g('days'),v=document.getElementById('v');v.textContent=ok?'YES':'NO';v.className='v '+(ok?'yes':'no');document.getElementById('vt').textContent=ok?'You reach the guarantee before the banner ends.':'Do not start this banner. If you cannot reach the guarantee, do not summon.'}
 M.querySelectorAll('input').forEach(i=>i.oninput=run);run()}
function show(){let k=location.hash.slice(1);if(!names[k])k='home';N.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.k===k);if(b.dataset.k===k)b.scrollIntoView({block:'nearest',inline:'center'})});
 if(k==='home')home();else if(k==='how')how();else if(k==='org-power')org();else if(k==='pull-calculator')calc();else table(D.pages.find(p=>p.id===k));window.scrollTo(0,0)}
window.onhashchange=show;show();
</script></body></html>
